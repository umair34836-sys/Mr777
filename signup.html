 type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getAuth,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);signup.onclick=async()=>{const u=username.value.trim(),p=phone.value.trim(),e=email.value.trim(),pw=password.value;if(!u||!p||!e||pw.length<6){msg.textContent="Sab fields fill karo. Password 6+ characters ka ho.";msg.className="msg show err";return}try{const c=await createUserWithEmailAndPassword(auth,e,pw);await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,username:u,phone:p,email:e,status:"active",isAdmin:false,coins:{},totalGames:0,wins:0,losses:0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});location.href="index.html"}catch(e){msg.textContent=e.message;msg.className="msg show err"}};</script></body></html>
