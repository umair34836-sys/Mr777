<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>User Details | Coin Flip Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#8d632b;letter-spacing:.5px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{color:#6e522d;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.adminnav a{padding:9px 12px;border-radius:9px;background:#eee6da;text-decoration:none;color:#392d20;font-size:12px;font-weight:800}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.tile{padding:17px;border:1px solid #e5dbcc;border-radius:13px;background:#faf6ef}.tile span{font-size:12px;color:#81786d}.tile b{display:block;font-size:23px;color:#8d632b;margin-top:4px;word-break:break-word}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #e5dbcc;border-radius:9px;background:#fff;color:#29231d}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.soft{background:#eee6da;color:#392d20}.danger{background:#b63e39;color:#fff}.msg{padding:11px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:700}.ok{background:#edf8f1;color:#286f43}.err{background:#fff0ef;color:#963530}.hidden{display:none}.small{font-size:12px;color:#81786d}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:780px){.grid,.tiles{grid-template-columns:1fr}.head{padding:10px 0}.page{padding-top:20px}}
</style>
</head>
<body>
<header class="top"><div class="wrap head"><div class="brand">COIN FLIP</div><div class="nav"><a href="index.html">Lobby</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><a href="withdrawal.html">Withdrawal</a><button id="logout" class="btn soft">Logout</button></div></div></header>
<main class="wrap page">
<div class="adminnav"><a href="admin.html">Dashboard</a><a href="admin-users.html">Users</a><a href="admin-coins.html">Coins</a><a href="admin-games.html">Games</a><a href="admin-coinflip.html">Coin Flip</a><a href="admin-transactions.html">Transactions</a></div>
<section class="card"><h1>User Details</h1><div id="msg" class="msg hidden"></div>
<div class="grid">
<div class="field"><label>Username</label><input id="username" readonly></div><div class="field"><label>Email</label><input id="email" readonly></div>
<div class="field"><label>Phone</label><input id="phone" readonly></div><div class="field"><label>UID</label><input id="uid" readonly></div>
<div class="field"><label>Status</label><select id="status"><option value="active">active</option><option value="blocked">blocked</option></select></div>
<div class="field"><label>Total Games</label><input id="games" readonly></div><div class="field"><label>Wins</label><input id="wins" readonly></div><div class="field"><label>Losses</label><input id="losses" readonly></div>
</div><button id="saveStatus" class="btn primary">Save Status</button></section>
<section class="card"><h2>Coin Balance Control</h2><p class="small">Wallet data is loaded from <b>wallets/{uid}</b>. If the wallet document does not exist, it will be created when coins are added.</p>
<div class="grid"><div class="field"><label>Coin ID</label><input id="coin" placeholder="e.g. HFC"></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0.00000001" step="any" placeholder="0"></div></div>
<div class="actions"><button id="add" class="btn primary">Add Coins</button><button id="remove" class="btn danger">Remove Coins</button></div><div id="balances" class="tiles" style="margin-top:15px"></div></section>
<section class="card"><h2>Game Statistics</h2><div id="stats" class="tiles"></div></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app); const $=id=>document.getElementById(id);
function message(text,ok=false){const el=$("msg");el.textContent=text;el.className="msg "+(ok?"ok":"err");}
$("logout").onclick=async()=>{await signOut(auth);location.href="login.html"};
function getTarget(){const p=new URLSearchParams(location.search);return (p.get("uid")||p.get("id")||"").trim()}
async function load(){
 try{
  const me=auth.currentUser;if(!me){location.href="login.html";return}
  const meSnap=await getDoc(doc(db,"users",me.uid)); if(!meSnap.exists()){location.href="login.html";return}
  const meData=meSnap.data(); if(meData.status==="blocked"){await signOut(auth);location.href="login.html";return}
  if(meData.isAdmin!==true){location.href="index.html";return}
  const target=getTarget(); if(!target){message("User UID missing. Users page se Manage button use karein.");return}
  const userRef=doc(db,"users",target), walletRef=doc(db,"wallets",target), statsRef=doc(db,"gameStats",target);
  const [us,ws,gs]=await Promise.all([getDoc(userRef),getDoc(walletRef),getDoc(statsRef)]);
  if(!us.exists()){message("User document nahi mila. UID check karein: "+target);return}
  let user=us.data(), wallet=ws.exists()?ws.data():{}, stats=gs.exists()?gs.data():{};
  const uid=us.id; user.uid=user.uid||uid;
  render(user,wallet,stats,uid);
  $("saveStatus").onclick=async()=>{try{await updateDoc(userRef,{status:$("status").value,updatedAt:serverTimestamp()});user.status=$("status").value;message("Account status successfully updated.",true)}catch(e){message("Status update failed: "+e.message)}};
  async function adjust(direction){
   const coin=$("coin").value.trim(); const amount=Number($("amount").value);
   if(!coin||!Number.isFinite(amount)||amount<=0){message("Coin ID aur valid amount enter karein.");return}
   const balances={...(wallet.balances||wallet.coins||{})}; const old=Number(balances[coin]||0), next=old+(direction*amount);
   if(next<0){message("Balance negative nahi ho sakta.");return}
   balances[coin]=next;
   try{await setDoc(walletRef,{uid,balances,updatedAt:serverTimestamp()},{merge:true});wallet={...wallet,uid,balances};render(user,wallet,stats,uid);message((direction>0?"Coins added: ":"Coins removed: ")+amount+" "+coin,true)}catch(e){message("Balance update failed: "+e.message)}
  }
  $("add").onclick=()=>adjust(1);$("remove").onclick=()=>adjust(-1);
 }catch(e){console.error(e);message("Page error: "+e.message)}
}
function render(user,wallet,stats,uid){
 $("username").value=user.username||"";$("email").value=user.email||"";$("phone").value=user.phone||"";$("uid").value=uid;$("status").value=user.status||"active";
 const total=Number(stats.totalGames??user.totalGames??0),wins=Number(stats.wins??user.wins??0),losses=Number(stats.losses??user.losses??0);
 $("games").value=total;$("wins").value=wins;$("losses").value=losses;
 $("stats").innerHTML=`<div class="tile"><span>Total Games</span><b>${total}</b></div><div class="tile"><span>Wins</span><b>${wins}</b></div><div class="tile"><span>Losses</span><b>${losses}</b></div><div class="tile"><span>Win Rate</span><b>${total?(wins/total*100).toFixed(1):"0.0"}%</b></div>`;
 const balances=wallet.balances||wallet.coins||{}; const entries=Object.entries(balances);$("balances").innerHTML=entries.length?entries.map(([k,v])=>`<div class="tile"><span>${k}</span><b>${Number(v).toLocaleString()}</b></div>`).join(""):"<div class='tile'><span>Wallet</span><b>0</b></div>";
}
onAuthStateChanged(auth,u=>{if(!u){location.href="login.html";return}load()});
</script>
</body></html>
