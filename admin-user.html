<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Details</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#8d632b;letter-spacing:.5px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{color:#6e522d;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{padding:17px;border:1px solid #e5dbcc;border-radius:13px;background:#faf6ef}.tile span{font-size:12px;color:#81786d}.tile b{display:block;font-size:24px;color:#8d632b;margin-top:4px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #e5dbcc;border-radius:9px;background:#fff;color:#29231d}.field textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.soft{background:#eee6da;color:#392d20}.danger{background:#b63e39;color:#fff}.msg{display:none;padding:11px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:700}.show{display:block}.ok{background:#edf8f1;color:#286f43}.err{background:#fff0ef;color:#963530}.small{font-size:12px;color:#81786d}.muted{color:#81786d}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee6da;font-size:13px}th{font-size:11px;color:#81786d;text-transform:uppercase}.actions{display:flex;gap:6px;flex-wrap:wrap}.coin{width:150px;height:150px;border-radius:50%;margin:25px auto 15px;display:grid;place-items:center;font-size:44px;font-weight:900;color:#855d26;background:radial-gradient(circle at 30% 25%,#fff,#ead5ab 55%,#a77430);border:8px solid #b78a4b;box-shadow:0 12px 28px #62441b22}.spin{animation:spin .8s ease}@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1800deg)}}.center{text-align:center}.gamecard{cursor:pointer;transition:.15s}.gamecard:hover{transform:translateY(-2px)}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;background:#eee6da}.active{background:#edf8f1;color:#286f43}.soon{background:#f2eadc;color:#8d632b}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.adminnav a{padding:9px 12px;border-radius:9px;background:#eee6da;text-decoration:none;color:#392d20;font-size:12px;font-weight:800}@media(max-width:780px){.grid,.tiles{grid-template-columns:1fr}.head{height:auto;min-height:68px;padding:10px 0}.top{height:auto}.nav{justify-content:flex-end}.page{padding-top:20px}}
</style></head><body><header class="top"><div class="wrap head"><div class="brand">COIN FLIP</div><div class="nav"><a href="index.html">Lobby</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><a href="withdrawal.html">Withdrawal</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><div class="adminnav"><a href="admin.html">Dashboard</a><a href="admin-users.html">Users</a><a href="admin-coins.html">Coins</a><a href="admin-games.html">Games</a><a href="admin-coinflip.html">Coin Flip</a><a href="admin-transactions.html">Transactions</a></div><section class="card"><h1>User Details</h1><div id="msg" class="msg"></div><div class="grid"><div class="field"><label>Username</label><input id="username" disabled></div><div class="field"><label>Email</label><input id="email" disabled></div><div class="field"><label>Phone</label><input id="phone" disabled></div><div class="field"><label>UID</label><input id="uid" disabled></div><div class="field"><label>Status</label><select id="status"><option>active</option><option>blocked</option></select></div><div class="field"><label>Total Games</label><input id="games" disabled></div><div class="field"><label>Wins</label><input id="wins" disabled></div><div class="field"><label>Losses</label><input id="losses" disabled></div></div><button id="saveStatus" class="btn primary">Save Status</button></section><section class="card"><h2>Coin Balance Control</h2><div class="grid"><div class="field"><label>Coin ID</label><input id="coin"></div><div class="field"><label>Amount</label><input id="amount" type="number" step=".01"></div></div><button id="add" class="btn primary">Add Coins</button> <button id="remove" class="btn danger">Remove Coins</button><div id="balances" class="tiles" style="margin-top:15px"></div></section><section class="card"><h2>Game Statistics</h2><div id="stats" class="tiles"></div></section></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);

onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||s.data().status==="blocked"){await signOut(auth);return location.href="login.html"};window.ME={...s.data(),uid:u.uid};window.DB=db;const a=await getDoc(doc(DB,"users",ME.uid));if(!a.exists()||a.data().isAdmin!==true){location.href="index.html";throw Error("Admin only")}const target=new URLSearchParams(location.search).get("uid");if(!target){location.href="admin-users.html";return}const ref=doc(DB,"users",target);const snap=await getDoc(ref);if(!snap.exists()){location.href="admin-users.html";return}let u=snap.data();function render(){ $("username").value=u.username||"";$("email").value=u.email||"";$("phone").value=u.phone||"";$("uid").value=u.uid||target;$("status").value=u.status||"active";$("games").value=u.totalGames||0;$("wins").value=u.wins||0;$("losses").value=u.losses||0;const g=u.totalGames||0,w=u.wins||0;$("stats").innerHTML=`<div class="tile"><span>Total Games</span><b>${g}</b></div><div class="tile"><span>Wins</span><b>${w}</b></div><div class="tile"><span>Losses</span><b>${u.losses||0}</b></div><div class="tile"><span>Win Rate</span><b>${g?(w/g*100).toFixed(1):0}%</b></div>`;$("balances").innerHTML=Object.entries(u.coins||{}).map(([k,v])=>`<div class="tile"><span>${k}</span><b>${v}</b></div>`).join("")||'<p class="small">No balances.</p>'}render();$("saveStatus").onclick=async()=>{await updateDoc(ref,{status:$("status").value,updatedAt:serverTimestamp()});u.status=$("status").value;$("msg").textContent="Status updated.";$("msg").className="msg show ok"};async function adjust(dir){const c=$("coin").value.trim(),n=Number($("amount").value);if(!c||!n||n<=0)return;const coins={...(u.coins||{})};const v=Number(coins[c]||0)+dir*n;if(v<0)return alert("Balance negative nahi ho sakta.");coins[c]=v;await updateDoc(ref,{coins,updatedAt:serverTimestamp()});u.coins=coins;render();$("msg").textContent="Balance updated.";$("msg").className="msg show ok"}$("add").onclick=()=>adjust(1);$("remove").onclick=()=>adjust(-1);});
</script></body></html>
