<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coin Flip</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#2b261f;font-family:Inter,Arial,sans-serif}
.wrap{width:min(1120px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e4dacb;display:flex;align-items:center}
.head{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:#8b622b;letter-spacing:.4px}
main{padding:28px 0 50px}.card{background:#fffdf9;border:1px solid #e4dacb;border-radius:18px;padding:22px;box-shadow:0 10px 28px #50371912}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(135deg,#c39a5c,#8b622b);color:#fff}.soft{background:#eee6da;color:#40382d}.danger{background:#b53e39;color:#fff}
.small{font-size:12px;color:#81786d}.title{text-align:center;margin:0}.sub{text-align:center;color:#81786d;font-size:13px}
.msg{display:none;padding:11px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:700}.show{display:block}.err{background:#fff0ef;color:#963530}.ok{background:#edf8f1;color:#286f43}
.account{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.user{display:flex;gap:11px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#a77b3b;color:#fff;font-weight:900}
.balance{text-align:right}.balance b{font-size:24px;color:#8b622b;display:block}.coin{width:155px;height:155px;border-radius:50%;margin:28px auto 18px;display:grid;place-items:center;font-size:45px;font-weight:900;color:#855d26;background:radial-gradient(circle at 30% 25%,#fff,#ead5ab 55%,#a77430);border:8px solid #b78a4b;box-shadow:0 12px 28px #62441b22}
.spin{animation:spin .8s ease}@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1800deg)}}
.choices{display:flex;justify-content:center;gap:9px}.bet{max-width:380px;margin:18px auto}.bet label,.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field{margin:11px 0}.field input,.field select{width:100%;padding:11px;border:1px solid #e4dacb;border-radius:9px;background:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;border:1px solid #e7ddcf;border-radius:11px;background:#faf6ef}.stat span{display:block;font-size:11px;color:#81786d}.stat b{font-size:19px}
.green{color:#25814b}.red{color:#b53e39}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee6da;font-size:13px}th{font-size:11px;color:#81786d;text-transform:uppercase}
.form{max-width:450px;margin:35px auto}.form h1{text-align:center}.form .btn{width:100%}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid #e4dacb;background:#fff;padding:10px 12px;border-radius:9px;font-weight:800;cursor:pointer}.active{background:#8b622b;color:#fff}.hide{display:none!important}
.adminstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.action{display:flex;gap:6px;flex-wrap:wrap}.action .btn{padding:7px 9px;font-size:12px}
@media(max-width:780px){.grid,.adminstats{grid-template-columns:1fr}.account{flex-direction:column;align-items:flex-start}.balance{text-align:left}}
</style></head>
<body><header class="top"><div class="wrap head"><div class="brand">COIN FLIP</div><button id="logout" class="btn soft">Logout</button></div></header>
<main class="wrap"><div id="msg" class="msg"></div><section class="card account"><div class="user"><div id="avatar" class="avatar">U</div><div><b id="username">User</b><div id="email" class="small"></div></div></div>
<div class="balance"><span class="small">Available Balance</span><b><span id="balance">0</span> <span id="coinName">Coin</span></b></div></section>
<div class="grid"><section class="card"><h1 class="title">Coin Flip</h1><p class="sub">Heads ya Tails choose karo aur bet amount enter karo.</p>
<div class="bet"><label>Bet Amount</label><input id="bet" type="number" min="1" step=".01" value="1"></div><div class="small" style="text-align:center">Min: <b id="minBet">1</b> · Max: <b id="maxBet">100</b> · Coin value: <b id="coinValue">1 PKR</b></div>
<div id="coin" class="coin">?</div><p id="result" class="sub">Choose your side</p><div class="choices"><button id="heads" class="btn primary">Heads</button><button id="tails" class="btn soft">Tails</button></div></section>
<aside class="card"><h2>Account Overview</h2><div class="stats"><div class="stat"><span>Total Games</span><b id="games">0</b></div><div class="stat"><span>Wins</span><b id="wins" class="green">0</b></div><div class="stat"><span>Losses</span><b id="losses" class="red">0</b></div><div class="stat"><span>Win Rate</span><b id="rate">0%</b></div></div><button id="admin" class="btn" style="display:none;width:100%;margin-top:15px;background:#28231d;color:#fff">Admin Panel</button></aside></div>
<section class="card" style="margin-top:18px"><h2>Recent Games</h2><div class="table"><table><thead><tr><th>Time</th><th>Choice</th><th>Result</th><th>Outcome</th><th>Stake</th></tr></thead><tbody id="history"></tbody></table></div></section></main>
<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",
  authDomain: "mr777-c72fc.firebaseapp.com",
  projectId: "mr777-c72fc",
  storageBucket: "mr777-c72fc.firebasestorage.app",
  messagingSenderId: "1027130368908",
  appId: "1:1027130368908:web:7e3cf883e137935523eca9",
  measurementId: "G-3GTQHMNF9L"
};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp,addDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let me,user,settings={coinId:"hfc",coinName:"HFC",coinValuePKR:1,minBet:1,maxBet:100};
const $=x=>document.getElementById(x);function show(t,e=false){$("msg").textContent=t;$("msg").className="msg show "+(e?"err":"ok")}
async function load(){const s=await getDoc(doc(db,"settings","coinflip"));if(s.exists())settings={...settings,...s.data()};$("coinName").textContent=settings.coinName;$("coinValue").textContent=settings.coinValuePKR+" PKR";$("minBet").textContent=settings.minBet;$("maxBet").textContent=settings.maxBet}
async function userLoad(){const s=await getDoc(doc(db,"users",me.uid));if(!s.exists())return false;user=s.data();if(user.status==="blocked"){await signOut(auth);return false};$("username").textContent=user.username||"User";$("email").textContent=user.email||me.email;$("avatar").textContent=(user.username||"U")[0].toUpperCase();$("balance").textContent=Number((user.coins||{})[settings.coinId]||0);$("games").textContent=user.totalGames||0;$("wins").textContent=user.wins||0;$("losses").textContent=user.losses||0;$("rate").textContent=(user.totalGames?((user.wins/user.totalGames)*100).toFixed(1):"0")+"%";if(user.isAdmin)$("admin").style.display="block";return true}
async function play(choice){show("");const stake=Number($("bet").value);const bal=Number((user.coins||{})[settings.coinId]||0);if(stake<settings.minBet||stake>settings.maxBet)return show("Bet range invalid hai.",true);if(stake>bal)return show("Insufficient balance.",true);
$("heads").disabled=$("tails").disabled=true;$("coin").classList.add("spin");$("result").textContent="Processing...";await new Promise(r=>setTimeout(r,800));
/* IMPORTANT: actual production outcome + wallet mutation MUST be performed by a trusted Firebase backend function. This UI intentionally does not fake a secure server transaction. */
$("coin").classList.remove("spin");$("heads").disabled=$("tails").disabled=false;show("Frontend ready hai. Secure server function connect karne ke baad live play enable hoga.",true);$("result").textContent="Secure backend required";}
$("heads").onclick=()=>play("Heads");$("tails").onclick=()=>play("Tails");$("logout").onclick=async()=>{await signOut(auth);location.href="login.html"};$("admin").onclick=()=>location.href="admin.html";
onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";me=u;await load();if(await userLoad()){const q=query(collection(db,"games"),where("uid","==",me.uid),orderBy("createdAt","desc"),limit(30));onSnapshot(q,s=>{$("history").innerHTML=s.docs.map(d=>{const x=d.data();return `<tr><td>${x.createdAt?.toDate?.()?.toLocaleString()||"—"}</td><td>${x.choice||"—"}</td><td>${x.result||"—"}</td><td>${x.outcome||"—"}</td><td>${x.stake||0} ${x.coinName||settings.coinName}</td></tr>`}).join("")||'<tr><td colspan="5" style="text-align:center">No games yet.</td></tr>'})}});
</script></body></html>
