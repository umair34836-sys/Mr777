<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#8d632b;letter-spacing:.5px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{color:#6e522d;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12;margin-bottom:18px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #e5dbcc;border-radius:9px;background:#fff;color:#29231d}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.soft{background:#eee6da;color:#392d20}.msg{display:none;padding:11px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:700}.show{display:block}.ok{background:#edf8f1;color:#286f43}.err{background:#fff0ef;color:#963530}.small{font-size:12px;color:#81786d}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.adminnav a{padding:9px 12px;border-radius:9px;background:#eee6da;text-decoration:none;color:#392d20;font-size:12px;font-weight:800}.rank-row{display:grid;grid-template-columns:80px 1fr 1fr 40px;gap:10px;align-items:center;padding:12px;background:#faf6ef;border:1px solid #e5dbcc;border-radius:9px;margin-bottom:8px}.rank-row input{padding:8px;font-size:13px}@media(max-width:780px){.head{height:auto;min-height:68px;padding:10px 0}.top{height:auto}.nav{justify-content:flex-end}.page{padding-top:20px}.rank-row{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap head"><div class="brand">💎 VIP ADMIN</div><div class="nav"><a href="index.html">Lobby</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><div class="adminnav"><a href="admin.html">Dashboard</a><a href="admin-users.html">Users</a><a href="admin-coins.html">Coins</a><a href="admin-games.html">Games</a><a href="admin-coinflip.html">Coin Flip</a><a href="admin-crash.html">Crash</a><a href="admin-mines.html">Mines</a><a href="admin-vip.html">VIP</a><a href="admin-transactions.html">Transactions</a></div><section class="card"><h1>🏆 VIP Rank System</h1><p class="small">VIP thresholds aur daily rewards yahan se control karein. Users deposit karke VIP levels unlock karenge.</p><div id="msg" class="msg"></div><h2>VIP Thresholds (Deposit Amount)</h2><div id="thresholds"></div><button id="addThreshold" class="btn soft">+ Add VIP Level</button></section><section class="card"><h2>💰 Daily Rewards (per VIP Level)</h2><div id="rewards"></div><button id="addReward" class="btn soft">+ Add Reward Level</button></section><button id="save" class="btn primary" style="width:100%;padding:14px">💾 Save VIP Settings</button></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
if($("logout"))$("logout").onclick=async()=>{await signOut(auth);location.href="login.html"};
onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||s.data().status==="blocked"||s.data().isAdmin!==true){await signOut(auth);return location.href="index.html"}

let thresholds=[{vip:0,minDeposit:0},{vip:1,minDeposit:300},{vip:2,minDeposit:1000}];
let rewards=[{vip:0,reward:10},{vip:1,reward:50},{vip:2,reward:200}];

const snap=await getDoc(doc(db,"settings","vip"));
if(snap.exists()){
  const d=snap.data();
  thresholds=d.thresholds||thresholds;
  rewards=d.rewards||rewards;
}

function renderThresholds(){
  $("thresholds").innerHTML=thresholds.map((t,i)=>`<div class="rank-row">
    <b>VIP ${t.vip}</b>
    <input type="number" placeholder="VIP Level" value="${t.vip}" data-i="${i}" data-field="vip">
    <input type="number" placeholder="Min Deposit" value="${t.minDeposit}" data-i="${i}" data-field="minDeposit">
    <button class="btn soft" onclick="removeThreshold(${i})">×</button>
  </div>`).join("");
  document.querySelectorAll('#thresholds input').forEach(inp=>{
    inp.onchange=e=>{
      const i=Number(e.target.dataset.i);
      const f=e.target.dataset.field;
      thresholds[i][f]=Number(e.target.value);
    };
  });
}

function renderRewards(){
  $("rewards").innerHTML=rewards.map((r,i)=>`<div class="rank-row">
    <b>VIP ${r.vip}</b>
    <input type="number" placeholder="VIP Level" value="${r.vip}" data-i="${i}" data-field="vip">
    <input type="number" placeholder="Daily Reward" value="${r.reward}" data-i="${i}" data-field="reward">
    <button class="btn soft" onclick="removeReward(${i})">×</button>
  </div>`).join("");
  document.querySelectorAll('#rewards input').forEach(inp=>{
    inp.onchange=e=>{
      const i=Number(e.target.dataset.i);
      const f=e.target.dataset.field;
      rewards[i][f]=Number(e.target.value);
    };
  });
}

window.removeThreshold=i=>{thresholds.splice(i,1);renderThresholds();};
window.removeReward=i=>{rewards.splice(i,1);renderRewards();};

$("addThreshold").onclick=()=>{thresholds.push({vip:thresholds.length,minDeposit:0});renderThresholds();};
$("addReward").onclick=()=>{rewards.push({vip:rewards.length,reward:0});renderRewards();};

$("save").onclick=async()=>{
  thresholds.sort((a,b)=>a.vip-b.vip);
  rewards.sort((a,b)=>a.vip-b.vip);
  await setDoc(doc(db,"settings","vip"),{thresholds,rewards,updatedAt:serverTimestamp()},{merge:true});
  $("msg").textContent="VIP settings saved successfully!";
  $("msg").className="msg show ok";
  setTimeout(()=>{$("msg").className="msg"},3000);
};

renderThresholds();
renderRewards();
});
</script></body></html>
