<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#3a7bd5 0%,#7ec3e8 22%,#ffd9a0 48%,#ff9a8a 68%,#c86dd7 100%);
  color:#fff;font-family:Arial,sans-serif;
}
.wrap{width:min(1180px,96%);margin:auto}

/* ===== TOP BAR (magenta, gold border) ===== */
.top{flex:0 0 auto;background:linear-gradient(180deg,#d5488a,#a02870);border-bottom:3px solid #ffd700;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.head{height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;letter-spacing:1px;font-size:18px;color:#ffd700;text-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ===== BOTTOM NAV (green bar) ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:space-around;align-items:center;gap:4px;background:linear-gradient(180deg,#3aa04a,#1c6b2a);border-top:3px solid #ffd700;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.nav a,.nav button{color:#fff;text-decoration:none;font-weight:800;font-size:12px;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.14);border:0;cursor:pointer;transition:.2s}
.nav a::after,.nav button::after{display:none}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.28)}

/* ===== PAGE: fit screen ===== */
.page{flex:1;min-height:0;overflow-y:auto;padding:8px 0 62px;-webkit-overflow-scrolling:touch}

.card{border:2px solid #ffd700;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.06))}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}

.tile{padding:8px 6px;border:1px solid rgba(255,215,0,.5);border-radius:12px;background:rgba(0,0,0,.25);text-align:center}
.tile span{font-size:9px;color:rgba(255,255,255,.85);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tile b{display:block;font-size:16px;margin-top:2px;font-weight:900;color:#ffd700}

.field{margin:8px 0}
.field label{display:block;font-size:10px;font-weight:800;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.9)}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid rgba(255,215,0,.5);border-radius:10px;background:rgba(0,0,0,.3);color:#fff;font-size:14px;font-weight:600}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#ffd700;box-shadow:0 0 0 3px rgba(255,215,0,.2)}
.field input:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);cursor:not-allowed;border-color:rgba(255,215,0,.3);opacity:1}
.field textarea{min-height:90px;resize:vertical}

.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;transition:.2s;font-size:14px;display:inline-block;text-decoration:none;text-align:center}
.btn:hover{transform:translateY(-2px)}
.primary{background:linear-gradient(180deg,#ffd700,#f0a000);color:#5a2a00;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.primary:hover{box-shadow:0 6px 20px rgba(0,0,0,.5)}
.soft{background:rgba(255,255,255,.2);color:#fff}
.soft:hover{background:rgba(255,255,255,.3)}
.danger{background:#d02a1a;color:#fff}
.danger:hover{box-shadow:0 6px 20px rgba(208,42,26,.5)}

.msg{display:none;padding:10px;border-radius:10px;margin:10px 0;font-size:13px;font-weight:700}
.show{display:block}
.ok{background:#0e2b1e;color:#7ee2a8;border:1px solid #1e4d34}
.err{background:#33141a;color:#ff9d9d;border:1px solid #5a2025}

.small{font-size:12px;color:rgba(255,255,255,.85)}
.muted{color:rgba(255,255,255,.6)}

.table{overflow:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:9px;border-bottom:1px solid rgba(255,215,0,.3);font-size:12px;color:#fff}
th{font-size:10px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.5px}
tbody tr:hover{background:rgba(255,215,0,.1)}

.actions{display:flex;gap:6px;flex-wrap:wrap}

.coin{width:140px;height:140px;border-radius:50%;margin:20px auto 12px;display:grid;place-items:center;font-size:42px;font-weight:900;color:#855d26;background:radial-gradient(circle at 30% 25%,#fff,#ead5ab 55%,#a77430);border:6px solid #b78a4b;box-shadow:0 12px 28px rgba(98,68,27,.4)}

.spin{animation:spin .8s ease}
@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1800deg)}}

.center{text-align:center}

.gamecard{cursor:pointer;transition:.15s}
.gamecard:hover{transform:translateY(-2px)}

.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;background:rgba(255,215,0,.2);color:#ffd700}
.active{background:#7ee2a8;color:#0e2b1e}
.soon{background:rgba(255,255,255,.2);color:#fff}

.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.adminnav a{padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.15);text-decoration:none;color:#fff;font-size:12px;font-weight:800;transition:.2s}
.adminnav a:hover{background:rgba(255,215,0,.3);color:#ffd700;transform:translateY(-2px)}

h1{margin:0 0 14px;font-size:26px;color:#ffd700;text-shadow:0 2px 8px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vip-badge{display:inline-block;padding:5px 12px;border-radius:16px;font-size:12px;font-weight:800;background:linear-gradient(135deg,#ffd700,#ffed4e);color:#8d2b2b;box-shadow:0 2px 8px rgba(0,0,0,.35)}
h2{margin:16px 0 10px;color:#ffd700;letter-spacing:-.3px;font-size:18px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
h2:first-of-type{margin-top:20px}

@media(max-width:640px){
  .head{height:48px}
  .brand{font-size:15px}
  .nav a,.nav button{font-size:11px;padding:7px 9px}
  .grid,.tiles{grid-template-columns:1fr}
  h1{font-size:22px}
}
</style></head><body><header class="top"><div class="wrap head"><div class="brand">COIN FLIP</div><div class="nav"><a href="index.html">Lobby</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><a href="withdrawal.html">Withdrawal</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><section class="card"><h1>Profile <span id="vipBadge" class="vip-badge">VIP 0</span></h1><div class="grid"><div class="field"><label>Username</label><input id="username" disabled></div><div class="field"><label>Email</label><input id="email" disabled></div><div class="field"><label>Phone</label><input id="phone" disabled></div><div class="field"><label>User ID</label><input id="uid" disabled></div><div class="field"><label>Account Status</label><input id="status" disabled></div><div class="field"><label>Total Deposited</label><input id="totalDeposited" disabled></div><div class="field"><label>Daily Streak</label><input id="streak" disabled></div><div class="field"><label>Win Rate</label><input id="winRate" disabled></div></div><h2>📊 Game Statistics</h2><div class="tiles"><div class="tile"><span>Total Games</span><b id="games">0</b></div><div class="tile"><span>Wins</span><b id="wins">0</b></div><div class="tile"><span>Losses</span><b id="losses">0</b></div></div><h2>💰 Coin Balances</h2><div id="coins" class="tiles"></div></section><section class="card"><h2>Transaction History</h2><p class="small">Deposit/withdrawal requests aur game activity admin records se linked hain.</p><a class="btn primary" href="deposit.html">Deposits</a> <a class="btn soft" href="withdrawal.html">Withdrawals</a> <a class="btn soft" href="daily.html">Daily Rewards</a></section></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,query,where,orderBy,limit,onSnapshot}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
if($("logout"))$("logout").onclick=async()=>{await signOut(auth);location.href="login.html"};

onAuthStateChanged(auth,async u=>{
  if(!u)return location.href="login.html";
  
  const s=await getDoc(doc(db,"users",u.uid));
  if(!s.exists()||s.data().status==="blocked"){
    await signOut(auth);
    return location.href="login.html";
  }
  
  const ME={...s.data(),uid:u.uid};
  
  $("username").value=ME.username||"";
  $("email").value=ME.email||"";
  $("phone").value=ME.phone||"";
  $("uid").value=ME.uid;
  $("status").value=ME.status||"active";
  
  const vip=Number(ME.currentVIP||0);
  const totalDeposited=Number(ME.totalDeposited||0);
  const streak=Number(ME.dailyStreak||0);
  $("vipBadge").textContent="VIP "+vip;
  $("totalDeposited").value=totalDeposited.toLocaleString()+" HFC";
  $("streak").value=streak+" / 7 days";
  
  onSnapshot(doc(db,"gameStats",u.uid),snap=>{
    const stats=snap.exists()?snap.data():{};
    const total=Number(stats.totalGames||0);
    const wins=Number(stats.wins||0);
    const losses=Number(stats.losses||0);
    $("games").textContent=total.toLocaleString();
    $("wins").textContent=wins.toLocaleString();
    $("losses").textContent=losses.toLocaleString();
    $("winRate").value=total?((wins/total*100).toFixed(1)+"%"):"0%";
  });
  
  onSnapshot(doc(db,"wallets",u.uid),snap=>{
    const w=snap.exists()?snap.data():{};
    const balances=w.balances||w.coins||{};
    const entries=Object.entries(balances);
    
    if(entries.length===0){
      $("coins").innerHTML='<p class="small">No coin balance yet. Deposit karein.</p>';
    }else{
      $("coins").innerHTML=entries.map(([k,v])=>
        `<div class="tile"><span>${String(k).toUpperCase()}</span><b>${Number(v||0).toLocaleString()}</b></div>`
      ).join("");
    }
  });
});
</script></body></html>
