<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Rewards</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#8d632b;letter-spacing:.5px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{color:#6e522d;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12;margin-bottom:18px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{padding:17px;border:1px solid #e5dbcc;border-radius:13px;background:#faf6ef}.tile span{font-size:12px;color:#81786d}.tile b{display:block;font-size:24px;color:#8d632b;margin-top:4px}.btn{border:0;border-radius:10px;padding:14px 24px;font-weight:800;cursor:pointer;font-size:16px}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.msg{display:none;padding:11px;border-radius:10px;margin:14px 0;font-size:13px;font-weight:700}.show{display:block}.ok{background:#edf8f1;color:#286f43}.err{background:#fff0ef;color:#963530}.small{font-size:12px;color:#81786d}.vip-badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:800;background:linear-gradient(135deg,#ffd700,#ffed4e);color:#8d632b;margin-left:10px}.reward-box{padding:30px;background:linear-gradient(135deg,#fffdf9,#f8f1e3);border:2px solid #c49b5d;border-radius:18px;margin:20px 0;box-shadow:0 10px 30px rgba(196,155,93,.2)}.reward-amount{font-size:48px;font-weight:900;background:linear-gradient(135deg,#c49b5d,#8d632b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.streak-display{display:flex;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}.streak-day{width:60px;height:80px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;border:2px solid #e5dbcc;background:#faf6ef}.streak-day.completed{background:linear-gradient(135deg,#edf8f1,#d4ebdf);border-color:#286f43}.streak-day.today{background:linear-gradient(135deg,#ffd700,#ffed4e);border-color:#c49b5d;transform:scale(1.1);box-shadow:0 4px 12px rgba(196,155,93,.3)}.streak-day.locked{opacity:.4}.streak-day .day-num{font-size:11px;color:#81786d}.streak-day .reward{font-size:16px;color:#8d632b}@media(max-width:780px){.tiles{grid-template-columns:1fr}.head{height:auto;min-height:68px;padding:10px 0}.top{height:auto}.nav{justify-content:flex-end}.page{padding-top:20px}.streak-day{width:50px;height:70px}}</style></head><body><header class="top"><div class="wrap head"><div class="brand">COIN FLIP</div><div class="nav"><a href="index.html">Lobby</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><a href="withdrawal.html">Withdrawal</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><section class="card"><h1>🎁 Daily Rewards <span id="vipBadge" class="vip-badge">VIP 0</span></h1><p class="small">7 din ki streak maintain karein aur rewards collect karein! Miss kiya to streak reset ho jayegi.</p><div class="tiles"><div class="tile"><span>Your VIP</span><b id="vip">0</b></div><div class="tile"><span>Current Streak</span><b id="streak">0</b> / 7</div><div class="tile"><span>Next Claim</span><b id="next">—</b></div></div><div class="streak-display" id="streakDisplay"></div><div class="reward-box"><p class="small">Today's reward for VIP <span id="vipLevel">0</span>, Day <span id="currentDay">1</span>:</p><div class="reward-amount" id="rewardAmount">+0</div><p class="small">HFC Coins</p></div><button id="claim" class="btn primary">🎁 Claim Daily Reward</button><div id="msg" class="msg"></div></section></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,onSnapshot,updateDoc,serverTimestamp,runTransaction}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
if($("logout"))$("logout").onclick=async()=>{await signOut(auth);location.href="login.html"};

function showMsg(t,x){const m=$("msg");m.className="msg show "+t;m.textContent=x;if(t==="ok")setTimeout(()=>{m.className="msg"},4000);}

onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("login.html");return}
  try{
    const uSnap=await getDoc(doc(db,"users",user.uid));
    if(!uSnap.exists()||uSnap.data().status==="blocked"){await signOut(auth);location.replace("login.html");return}
    
    // Load VIP and daily reward settings
    const vipSnap=await getDoc(doc(db,"settings","vip"));
    const dailySnap=await getDoc(doc(db,"settings","dailyRewards"));
    
    let vipSettings={thresholds:[{vip:0,minDeposit:0}]};
    if(vipSnap.exists())vipSettings=vipSnap.data();
    
    let dailyRewards={
      vip0:[0.5,1,1.5,2,3,5,10],
      vip1:[1,2,3,5,8,12,25],
      vip2:[2,5,8,12,20,30,60],
      vip3:[5,10,20,35,50,80,150],
      vip4:[10,25,50,100,150,250,500],
      vip5:[25,50,100,200,400,600,1200]
    };
    if(dailySnap.exists())dailyRewards=dailySnap.data().rewards||dailyRewards;

    onSnapshot(doc(db,"users",user.uid),s=>{
      const u=s.exists()?s.data():{};
      const vip=Number(u.currentVIP||0);
      const streak=Number(u.dailyStreak||0);
      const lastClaim=u.lastDailyReward?.toDate?.()||null;
      
      $("vip").textContent=vip;
      $("vipLevel").textContent=vip;
      $("vipBadge").textContent="VIP "+vip;
      $("streak").textContent=streak;
      
      // Get rewards for current VIP
      const vipKey="vip"+vip;
      const rewards=dailyRewards[vipKey]||dailyRewards.vip0||[0.5,1,1.5,2,3,5,10];
      
      // Current day (0-6 for 7 days)
      const currentDay=streak%7;
      $("currentDay").textContent=currentDay+1;
      const todayReward=rewards[currentDay]||0;
      $("rewardAmount").textContent="+"+todayReward.toFixed(2);
      
      // Render streak display
      $("streakDisplay").innerHTML=rewards.map((r,i)=>{
        const isCompleted=i<currentDay;
        const isToday=i===currentDay;
        const isLocked=i>currentDay;
        return `<div class="streak-day ${isCompleted?'completed':''} ${isToday?'today':''} ${isLocked?'locked':''}">
          <div class="day-num">Day ${i+1}</div>
          <div class="reward">${r}</div>
        </div>`;
      }).join('');
      
      // Check if can claim
      const now=new Date();
      if(lastClaim){
        const diff=now-lastClaim;
        const hours=diff/(1000*60*60);
        if(hours<24){
          const remaining=Math.ceil(24-hours);
          $("next").textContent=remaining+"h";
          $("claim").disabled=true;
          $("claim").textContent="⏰ Come back in "+remaining+" hours";
        }else{
          $("next").textContent="Now!";
          $("claim").disabled=false;
          $("claim").textContent="🎁 Claim Daily Reward";
        }
      }else{
        $("next").textContent="Now!";
        $("claim").disabled=false;
      }
    });

    $("claim").onclick=async()=>{
      try{
        await runTransaction(db,async tx=>{
          const userRef=doc(db,"users",user.uid);
          const walletRef=doc(db,"wallets",user.uid);
          const uSnap=await tx.get(userRef);
          const wSnap=await tx.get(walletRef);
          
          if(!uSnap.exists()||!wSnap.exists())throw new Error("Data not found");
          
          const uData=uSnap.data();
          const wData=wSnap.data();
          const vip=Number(uData.currentVIP||0);
          const streak=Number(uData.dailyStreak||0);
          
          // Check 24 hours
          const lastClaim=uData.lastDailyReward?.toDate?.()||null;
          if(lastClaim){
            const hours=(new Date()-lastClaim)/(1000*60*60);
            if(hours<24)throw new Error("Already claimed today. Come back tomorrow!");
          }
          
          // Get reward for current day
          const vipKey="vip"+vip;
          const rewards=dailyRewards[vipKey]||dailyRewards.vip0||[0.5,1,1.5,2,3,5,10];
          const currentDay=streak%7;
          const dailyReward=rewards[currentDay]||0;
          
          // Update user: increment streak and set last claim
          const newStreak=streak+1;
          tx.update(userRef,{
            dailyStreak:newStreak,
            lastDailyReward:serverTimestamp()
          });
          
          // Add to wallet
          const field=("balances" in wData)?"balances":("coins" in wData)?"coins":"balances";
          const bals=wData[field]||{};
          const key="hfc";
          const currentBal=Number(bals[key]||0);
          
          tx.update(walletRef,{[field+"."+key]:currentBal+dailyReward});
        });
        
        showMsg("ok","🎉 Daily reward claimed successfully! Streak updated.");
      }catch(err){
        showMsg("err",err.message||"Failed to claim reward.");
      }
    };
  }catch(err){console.error(err);showMsg("err","Failed to load.");}
});
</script></body></html>
