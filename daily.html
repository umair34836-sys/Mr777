<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Rewards</title><style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#3a7bd5 0%,#7ec3e8 22%,#ffd9a0 48%,#ff9a8a 68%,#c86dd7 100%);
  color:#fff;font-family:Arial,sans-serif;
}
.wrap{width:min(1180px,96%);margin:auto}

/* ===== TOP BAR (magenta, gold border) ===== */
.top{flex:0 0 auto;background:linear-gradient(180deg,#d5488a,#a02870);border-bottom:3px solid #ffd700;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.head{height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;letter-spacing:1px;font-size:18px;color:#ffd700;text-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ===== BOTTOM NAV (green bar) ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:space-around;align-items:center;gap:4px;background:linear-gradient(180deg,#3aa04a,#1c6b2a);border-top:3px solid #ffd700;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.nav a,.nav button{color:#fff;text-decoration:none;font-weight:800;font-size:12px;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.14);border:0;cursor:pointer;transition:.2s}
.nav a::after,.nav button::after{display:none}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.28)}

/* ===== PAGE: fit screen ===== */
.page{flex:1;min-height:0;overflow-y:auto;padding:8px 0 62px;-webkit-overflow-scrolling:touch}

.card{border:2px solid #ffd700;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.06))}

h1{margin:0 0 8px;font-size:24px;color:#ffd700;text-shadow:0 2px 8px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:rgba(255,255,255,.85);margin:4px 0 10px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.tile{padding:8px 6px;border:1px solid rgba(255,215,0,.5);border-radius:12px;background:rgba(0,0,0,.25);text-align:center}
.tile span{font-size:9px;color:rgba(255,255,255,.85);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tile b{display:block;font-size:16px;margin-top:2px;font-weight:900;color:#ffd700}

/* ===== VIP BADGE ===== */
.vip-badge{display:inline-block;padding:4px 12px;border-radius:16px;font-size:12px;font-weight:800;background:linear-gradient(135deg,#ffd700,#ffed4e);color:#8d2b2b;box-shadow:0 2px 8px rgba(0,0,0,.35);margin-left:8px}

/* ===== STREAK DISPLAY ===== */
.streak-display{display:flex;justify-content:center;gap:6px;margin:14px 0;flex-wrap:wrap}
.streak-day{width:54px;height:72px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;border:2px solid rgba(255,215,0,.4);background:rgba(0,0,0,.3);transition:.2s}
.streak-day.completed{background:linear-gradient(135deg,#0f9d58,#1a8a5a);border-color:#7ee2a8}
.streak-day.today{background:linear-gradient(180deg,#ffd700,#f0a000);border-color:#fff;transform:scale(1.1);box-shadow:0 4px 14px rgba(255,215,0,.5)}
.streak-day.locked{opacity:.4}
.streak-day .day-num{font-size:10px;color:rgba(255,255,255,.85);font-weight:700}
.streak-day.today .day-num{color:#5a2a00}
.streak-day .reward{font-size:15px;color:#ffd700;margin-top:2px;font-weight:900}
.streak-day.completed .reward{color:#fff}
.streak-day.today .reward{color:#5a2a00}

/* ===== REWARD BOX ===== */
.reward-box{padding:20px;background:linear-gradient(145deg,rgba(255,215,0,.15),rgba(255,215,0,.05));border:2px solid #ffd700;border-radius:16px;margin:16px 0;box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 0 30px rgba(255,215,0,.08);text-align:center}
.reward-amount{font-size:48px;font-weight:900;background:linear-gradient(135deg,#ffd700,#fff2b0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 4px 20px rgba(255,215,0,.3)}
.reward-box .small{color:rgba(255,255,255,.85);margin:0}

/* ===== BUTTONS ===== */
.btn{border:0;border-radius:12px;padding:14px 24px;font-weight:800;cursor:pointer;font-size:16px;width:100%;transition:.2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.primary{background:linear-gradient(180deg,#ffd700,#f0a000);color:#5a2a00;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.primary:hover:not(:disabled){box-shadow:0 6px 20px rgba(0,0,0,.5);transform:translateY(-2px)}
.soft{background:rgba(255,255,255,.2);color:#fff}

/* ===== MESSAGES ===== */
.msg{display:none;padding:10px;border-radius:10px;margin:12px 0;font-size:13px;font-weight:700}
.show{display:block}
.ok{background:#0e2b1e;color:#7ee2a8;border:1px solid #1e4d34}
.err{background:#33141a;color:#ff9d9d;border:1px solid #5a2025}

@media(max-width:640px){
  .head{height:48px}
  .brand{font-size:15px}
  .nav a,.nav button{font-size:11px;padding:7px 9px}
  .tiles{grid-template-columns:1fr}
  h1{font-size:20px}
  .streak-day{width:42px;height:60px}
  .streak-day .reward{font-size:13px}
  .streak-day .day-num{font-size:9px}
  .reward-amount{font-size:40px}
  .btn{padding:12px 18px;font-size:15px}
}
</style></head><body><header class="top"><div class="wrap head"><div class="brand">🎁 DAILY REWARDS</div><div class="nav"><a href="index.html">Lobby</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><a href="withdrawal.html">Withdrawal</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><section class="card"><h1>🎁 Daily Rewards <span id="vipBadge" class="vip-badge">VIP 0</span></h1><p class="small">7 din ki streak maintain karein aur rewards collect karein! Miss kiya to streak reset ho jayegi.</p><div class="tiles"><div class="tile"><span>Your VIP</span><b id="vip">0</b></div><div class="tile"><span>Current Streak</span><b id="streak">0</b> / 7</div><div class="tile"><span>Next Claim</span><b id="next">—</b></div></div><div class="streak-display" id="streakDisplay"></div><div class="reward-box"><p class="small">Today's reward for VIP <span id="vipLevel">0</span>, Day <span id="currentDay">1</span>:</p><div class="reward-amount" id="rewardAmount">+0</div><p class="small">HFC Coins</p></div><button id="claim" class="btn primary">🎁 Claim Daily Reward</button><div id="msg" class="msg"></div></section></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,onSnapshot,updateDoc,serverTimestamp,runTransaction}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
if($("logout"))$("logout").onclick=async()=>{await signOut(auth);location.href="login.html"};

function showMsg(t,x){const m=$("msg");m.className="msg show "+t;m.textContent=x;if(t==="ok")setTimeout(()=>{m.className="msg"},4000);}

onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("login.html");return}
  try{
    const uSnap=await getDoc(doc(db,"users",user.uid));
    if(!uSnap.exists()||uSnap.data().status==="blocked"){await signOut(auth);location.replace("login.html");return}
    
    const vipSnap=await getDoc(doc(db,"settings","vip"));
    const dailySnap=await getDoc(doc(db,"settings","dailyRewards"));
    
    let vipSettings={thresholds:[{vip:0,minDeposit:0}]};
    if(vipSnap.exists())vipSettings=vipSnap.data();
    
    let dailyRewards={
      vip0:[0.5,1,1.5,2,3,5,10],
      vip1:[1,2,3,5,8,12,25],
      vip2:[2,5,8,12,20,30,60],
      vip3:[5,10,20,35,50,80,150],
      vip4:[10,25,50,100,150,250,500],
      vip5:[25,50,100,200,400,600,1200]
    };
    if(dailySnap.exists())dailyRewards=dailySnap.data().rewards||dailyRewards;

    onSnapshot(doc(db,"users",user.uid),s=>{
      const u=s.exists()?s.data():{};
      const vip=Number(u.currentVIP||0);
      const streak=Number(u.dailyStreak||0);
      const lastClaim=u.lastDailyReward?.toDate?.()||null;
      
      $("vip").textContent=vip;
      $("vipLevel").textContent=vip;
      $("vipBadge").textContent="VIP "+vip;
      $("streak").textContent=streak;
      
      const vipKey="vip"+vip;
      const rewards=dailyRewards[vipKey]||dailyRewards.vip0||[0.5,1,1.5,2,3,5,10];
      
      const currentDay=streak%7;
      $("currentDay").textContent=currentDay+1;
      const todayReward=rewards[currentDay]||0;
      $("rewardAmount").textContent="+"+todayReward.toFixed(2);
      
      $("streakDisplay").innerHTML=rewards.map((r,i)=>{
        const isCompleted=i<currentDay;
        const isToday=i===currentDay;
        const isLocked=i>currentDay;
        return `<div class="streak-day ${isCompleted?'completed':''} ${isToday?'today':''} ${isLocked?'locked':''}">
          <div class="day-num">Day ${i+1}</div>
          <div class="reward">${r}</div>
        </div>`;
      }).join('');
      
      const now=new Date();
      if(lastClaim){
        const diff=now-lastClaim;
        const hours=diff/(1000*60*60);
        if(hours<24){
          const remaining=Math.ceil(24-hours);
          $("next").textContent=remaining+"h";
          $("claim").disabled=true;
          $("claim").textContent="⏰ Come back in "+remaining+" hours";
        }else{
          $("next").textContent="Now!";
          $("claim").disabled=false;
          $("claim").textContent="🎁 Claim Daily Reward";
        }
      }else{
        $("next").textContent="Now!";
        $("claim").disabled=false;
      }
    });

    $("claim").onclick=async()=>{
      try{
        await runTransaction(db,async tx=>{
          const userRef=doc(db,"users",user.uid);
          const walletRef=doc(db,"wallets",user.uid);
          const uSnap=await tx.get(userRef);
          const wSnap=await tx.get(walletRef);
          
          if(!uSnap.exists()||!wSnap.exists())throw new Error("Data not found");
          
          const uData=uSnap.data();
          const wData=wSnap.data();
          const vip=Number(uData.currentVIP||0);
          const streak=Number(uData.dailyStreak||0);
          
          const lastClaim=uData.lastDailyReward?.toDate?.()||null;
          if(lastClaim){
            const hours=(new Date()-lastClaim)/(1000*60*60);
            if(hours<24)throw new Error("Already claimed today. Come back tomorrow!");
          }
          
          const vipKey="vip"+vip;
          const rewards=dailyRewards[vipKey]||dailyRewards.vip0||[0.5,1,1.5,2,3,5,10];
          const currentDay=streak%7;
          const dailyReward=rewards[currentDay]||0;
          
          const newStreak=streak+1;
          tx.update(userRef,{
            dailyStreak:newStreak,
            lastDailyReward:serverTimestamp()
          });
          
          const field=("balances" in wData)?"balances":("coins" in wData)?"coins":"balances";
          const bals=wData[field]||{};
          const key="hfc";
          const currentBal=Number(bals[key]||0);
          
          tx.update(walletRef,{[field+"."+key]:currentBal+dailyReward});
        });
        
        showMsg("ok","🎉 Daily reward claimed successfully! Streak updated.");
      }catch(err){
        showMsg("err",err.message||"Failed to claim reward.");
      }
    };
  }catch(err){console.error(err);showMsg("err","Failed to load.");}
});
</script></body></html>
