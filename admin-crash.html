<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crash Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#8d632b;letter-spacing:.5px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{color:#6e522d;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #e5dbcc;border-radius:9px;background:#fff;color:#29231d}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.soft{background:#eee6da;color:#392d20}.msg{display:none;padding:11px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:700}.show{display:block}.ok{background:#edf8f1;color:#286f43}.err{background:#fff0ef;color:#963530}.small{font-size:12px;color:#81786d}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee6da;font-size:13px}th{font-size:11px;color:#81786d;text-transform:uppercase}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.adminnav a{padding:9px 12px;border-radius:9px;background:#eee6da;text-decoration:none;color:#392d20;font-size:12px;font-weight:800}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{padding:17px;border:1px solid #e5dbcc;border-radius:13px;background:#faf6ef}.tile span{font-size:12px;color:#81786d}.tile b{display:block;font-size:24px;color:#8d632b;margin-top:4px}@media(max-width:780px){.grid,.tiles{grid-template-columns:1fr}.head{height:auto;min-height:68px;padding:10px 0}.top{height:auto}.nav{justify-content:flex-end}.page{padding-top:20px}}</style></head><body><header class="top"><div class="wrap head"><div class="brand">🚀 CRASH ADMIN</div><div class="nav"><a href="index.html">Lobby</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><div class="adminnav"><a href="admin.html">Dashboard</a><a href="admin-users.html">Users</a><a href="admin-coins.html">Coins</a><a href="admin-coinflip.html">Coin Flip</a><a href="admin-crash.html">Crash</a><a href="admin-transactions.html">Transactions</a></div><section class="card"><h1>Rocket Crash Control</h1><p class="small">Crash game ki saari settings yahan se control hongi.</p><div id="msg" class="msg"></div><div class="grid"><div class="field"><label>Game Status</label><select id="gameStatus"><option value="enabled">Enabled</option><option value="disabled">Disabled</option></select></div><div class="field"><label>Active Coin</label><select id="coin"><option value="">Loading...</option></select></div><div class="field"><label>Min Bet</label><input id="minBet" type="number" step=".01" value="1"></div><div class="field"><label>Max Bet</label><input id="maxBet" type="number" step=".01" value="1000"></div><div class="field"><label>Max Multiplier (x)</label><input id="maxMultiplier" type="number" step="1" value="50"></div></div><button id="save" class="btn primary">Save Crash Settings</button></section><section class="card"><div class="tiles"><div class="tile"><span>Total Rounds</span><b id="tRounds">0</b></div><div class="tile"><span>Cashed (Wins)</span><b id="tWins">0</b></div><div class="tile"><span>Crashed (Losses)</span><b id="tLoss">0</b></div></div></section><section class="card"><h2>Recent Rounds</h2><div class="table"><table><thead><tr><th>Time</th><th>Player</th><th>Stake</th><th>Cashed At</th><th>Crash Point</th><th>Outcome</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,onSnapshot,query,orderBy,limit,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
if($("logout"))$("logout").onclick=async()=>{await signOut(auth);location.href="login.html"};
onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||s.data().status==="blocked"){await signOut(auth);return location.href="login.html"};const a=await getDoc(doc(db,"users",u.uid));if(!a.exists()||a.data().isAdmin!==true){location.href="index.html";throw Error("Admin only")}

let coins=[];
const snap=await getDoc(doc(db,"settings","crash"));
if(snap.exists()){const g=snap.data();$("gameStatus").value=g.gameStatus??"enabled";$("minBet").value=g.minBet??1;$("maxBet").value=g.maxBet??1000;$("maxMultiplier").value=g.maxMultiplier??50;}

onSnapshot(collection(db,"coins"),s=>{
  coins=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false);
  const cur=snap.exists()?(snap.data().coinId||"hfc"):"hfc";
  $("coin").innerHTML=coins.length?coins.map(c=>`<option value="${c.id}" ${c.id===cur?"selected":""}>${c.name||c.id.toUpperCase()}</option>`).join(""):'<option value="hfc">HFC</option>';
});

onSnapshot(query(collection(db,"games"),orderBy("createdAt","desc"),limit(100)),s=>{
  const rows=s.docs.map(d=>d.data()).filter(x=>x.game==="crash");
  $("tRounds").textContent=rows.length;
  $("tWins").textContent=rows.filter(x=>x.outcome==="win").length;
  $("tLoss").textContent=rows.filter(x=>x.outcome==="loss").length;
  $("rows").innerHTML=rows.slice(0,30).map(x=>`<tr>
    <td>${x.createdAt?.toDate?.()?.toLocaleString()||"—"}</td>
    <td>${(x.uid||"").slice(0,6)}…</td>
    <td>${x.stake??"—"} ${x.coinName||""}</td>
    <td>${x.cashedAt?x.cashedAt.toFixed(2)+"x":"—"}</td>
    <td>${(x.crashPoint??0).toFixed(2)}x</td>
    <td>${x.outcome==="win"?"CASHED":"CRASHED"}</td>
  </tr>`).join("")||'<tr><td colspan="6">No rounds yet.</td></tr>';
});

$("save").onclick=async()=>{
  const coinId=$("coin").value||"hfc";
  const c=coins.find(x=>x.id===coinId);
  await setDoc(doc(db,"settings","crash"),{
    gameStatus:$("gameStatus").value,
    coinId,
    coinName:c?.name||coinId.toUpperCase(),
    minBet:Number($("minBet").value)||1,
    maxBet:Number($("maxBet").value)||1000,
    maxMultiplier:Number($("maxMultiplier").value)||50,
    updatedAt:serverTimestamp()
  },{merge:true});
  $("msg").textContent="Crash settings saved.";
  $("msg").className="msg show ok";
  setTimeout(()=>{$("msg").className="msg"},3000);
};
});
</script></body></html>
