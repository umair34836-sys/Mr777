<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Tiger Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#8d632b}.nav a{color:#6e522d;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #e5dbcc;border-radius:9px;background:#fff;color:#29231d}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;font-size:14px}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.msg{display:none;padding:11px;border-radius:10px;margin:14px 0;font-size:13px;font-weight:700}.show{display:block}.ok{background:#edf8f1;color:#286f43}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.adminnav a{padding:9px 12px;border-radius:9px;background:#eee6da;text-decoration:none;color:#392d20;font-size:12px;font-weight:800}.adminnav a.active{background:#8d632b;color:#fff}@media(max-width:780px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap head"><div class="brand">🐉 DRAGON TIGER ADMIN</div><div class="nav"><a href="index.html">Lobby</a></div></div></header><main class="wrap page"><div class="adminnav"><a href="admin.html">Dashboard</a><a href="admin-coinflip.html">Coin Flip</a><a href="admin-crash.html">Crash</a><a href="admin-mines.html">Mines</a><a href="admin-dragontiger.html" class="active">Dragon Tiger</a></div><section class="card"><h1>Dragon vs Tiger Control</h1><p class="small">Win chance aur limits yahan se control hongi — game mein foran sync hongi.</p><div id="msg" class="msg"></div><div class="grid"><div class="field"><label>Game Status</label><select id="gameStatus"><option value="enabled">Enabled</option><option value="disabled">Disabled</option></select></div><div class="field"><label>Win Chance (%)</label><input id="winChance" type="number" min="0" max="100" step="1" value="50"></div><div class="field"><label>Min Bet</label><input id="minBet" type="number" step=".01" value="1"></div><div class="field"><label>Max Bet</label><input id="maxBet" type="number" step=".01" value="1000"></div><div class="field"><label>Max Multiplier (Tie=9)</label><input id="maxMultiplier" type="number" step="1" value="9"></div></div><button id="save" class="btn primary">Save Settings</button></section></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
function showMsg(t,x){const m=$("msg");m.className="msg show "+t;m.textContent=x;if(t==="ok")setTimeout(()=>{m.className="msg"},3000);}
onAuthStateChanged(auth,async u=>{
  if(!u)return location.href="login.html";
  const s=await getDoc(doc(db,"users",u.uid));
  if(!s.exists()||s.data().isAdmin!==true){location.href="index.html";return}
  const cur=await getDoc(doc(db,"settings","dragontiger"));
  if(cur.exists()){const d=cur.data();$("gameStatus").value=d.gameStatus??"enabled";$("winChance").value=d.winChance??50;$("minBet").value=d.minBet??1;$("maxBet").value=d.maxBet??1000;$("maxMultiplier").value=d.maxMultiplier??9;}
  $("save").onclick=async()=>{
    await setDoc(doc(db,"settings","dragontiger"),{gameStatus:$("gameStatus").value,winChance:Number($("winChance").value)||0,minBet:Number($("minBet").value)||1,maxBet:Number($("maxBet").value)||1000,maxMultiplier:Number($("maxMultiplier").value)||9,coinId:"hfc",coinName:"HFC",updatedAt:serverTimestamp()},{merge:true});
    showMsg("ok","✅ Dragon Tiger settings saved!");
  };
});
</script></body></html>
