<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mines</title><style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#3a7bd5 0%,#7ec3e8 22%,#ffd9a0 48%,#ff9a8a 68%,#c86dd7 100%);
  color:#fff;font-family:Arial,sans-serif;
}
.wrap{width:min(1180px,96%);margin:auto}

/* ===== TOP BAR (magenta, gold border) ===== */
.top{flex:0 0 auto;background:linear-gradient(180deg,#d5488a,#a02870);border-bottom:3px solid #ffd700;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.head{height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;letter-spacing:1px;font-size:18px;color:#ffd700;text-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ===== BOTTOM NAV (green bar) ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:space-around;align-items:center;gap:4px;background:linear-gradient(180deg,#3aa04a,#1c6b2a);border-top:3px solid #ffd700;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.nav a{color:#fff;text-decoration:none;font-weight:800;font-size:12px;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.14);transition:.2s}
.nav a::after{display:none}
.nav a:hover{background:rgba(255,255,255,.28)}

/* ===== PAGE: fit screen ===== */
.page{flex:1;min-height:0;overflow-y:auto;padding:8px 0 62px;-webkit-overflow-scrolling:touch}

.card{border:2px solid #ffd700;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.06))}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{padding:8px 6px;border:1px solid rgba(255,215,0,.5);border-radius:12px;background:rgba(0,0,0,.25);text-align:center}
.tile span{font-size:9px;color:rgba(255,255,255,.85);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tile b{display:block;font-size:16px;margin-top:2px;font-weight:900;color:#ffd700}

.field{margin:8px 0}
.field label{display:block;font-size:10px;font-weight:800;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.9)}
.field input,.field select{width:100%;padding:10px;border:1px solid rgba(255,215,0,.5);border-radius:10px;background:rgba(0,0,0,.3);color:#fff;font-size:14px;font-weight:700}
.field input:focus,.field select:focus{outline:none;border-color:#ffd700;box-shadow:0 0 0 3px rgba(255,215,0,.2)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;transition:.2s;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.primary{background:linear-gradient(180deg,#ffd700,#f0a000);color:#5a2a00;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.primary:hover{box-shadow:0 6px 20px rgba(0,0,0,.5)}
.cash{background:linear-gradient(180deg,#ff9d3d,#e05b00);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cash:hover{box-shadow:0 6px 20px rgba(0,0,0,.5)}
.soft{background:rgba(255,255,255,.2);color:#fff}

.msg{display:none;padding:10px;border-radius:10px;margin:10px auto 0;font-size:13px;font-weight:700;max-width:560px}
.show{display:block}
.ok{background:#0e2b1e;color:#7ee2a8;border:1px solid #1e4d34}
.err{background:#33141a;color:#ff9d9d;border:1px solid #5a2025}

.small{font-size:12px;color:rgba(255,255,255,.85)}

.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:380px;margin:14px auto}
.cell{aspect-ratio:1;border:2px solid rgba(255,215,0,.4);border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.08));color:#fff;font-size:24px;cursor:pointer;display:grid;place-items:center;transition:.12s}
.cell:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.cell:disabled{cursor:not-allowed}
.cell.safe{background:linear-gradient(135deg,#0f9d58,#1a8a5a);border-color:#7ee2a8}
.cell.mine{background:linear-gradient(135deg,#d02a1a,#801a2a);border-color:#ff9d9d}

.center{text-align:center}
.mult{font-size:36px;font-weight:900;color:#ffd700;margin:8px 0;text-shadow:0 2px 8px rgba(0,0,0,.5)}

.table{overflow:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:9px;border-bottom:1px solid rgba(255,215,0,.3);font-size:12px;color:#fff}
th{font-size:10px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.5px}
tbody tr:hover{background:rgba(255,215,0,.1)}

h2{margin:6px 0 12px;color:#ffd700;text-shadow:0 2px 6px rgba(0,0,0,.4);font-size:18px}

@media(max-width:640px){
  .head{height:48px}.brand{font-size:15px}
  .nav a{font-size:11px;padding:7px 9px}
  .tiles{grid-template-columns:1fr}
  .board{max-width:320px}
  .cell{font-size:20px}
  .mult{font-size:30px}
}
</style></head><body><header class="top"><div class="wrap head"><div class="brand">💎 MINES</div><div class="nav"><a href="index.html">Lobby</a><a href="coinflip.html">Coin Flip</a><a href="crash.html">Crash</a><a href="profile.html">Profile</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><section class="card"><div class="tiles"><div class="tile"><span>Balance</span><b id="bal">0</b></div><div class="tile"><span>Min Bet</span><b id="min">1</b></div><div class="tile"><span>Max Bet</span><b id="max">1000</b></div></div><div class="field" style="max-width:200px;margin:16px auto"><label>Bet Amount</label><input id="bet" type="number" min="1" step=".01" value="1"></div><div class="field" style="max-width:200px;margin:12px auto"><label>Mines</label><select id="mines"><option>1</option><option>3</option><option selected>5</option><option>10</option><option>15</option><option>20</option></select></div><div class="center"><div class="mult" id="mult">1.00x</div><div class="board" id="board"></div><button id="start" class="btn primary">▶ Start Game</button> <button id="cash" class="btn cash" disabled>💰 Cash Out</button></div><div id="msg" class="msg"></div></section><section class="card"><h2 style="color:#e8e6f0">Recent Rounds</h2><div class="table"><table><thead><tr><th>Time</th><th>Stake</th><th>Picks</th><th>Cashed At</th><th>Outcome</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot,collection,query,where,limit,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
$("logout").onclick=async()=>{await signOut(auth);location.replace("login.html")};
function showMsg(t,x){const m=$("msg");m.className="msg show "+t;m.textContent=x;if(t==="ok")setTimeout(()=>{m.className="msg"},4000);}
function readBalanceCaseInsensitive(b,c){const w=String(c||"").trim().toLowerCase();for(const[k,v]of Object.entries(b||{})){if(String(k).trim().toLowerCase()===w)return Number(v)||0}return 0}
function readBalanceKey(b,c){const w=String(c||"").trim().toLowerCase();for(const k of Object.keys(b||{})){if(String(k).trim().toLowerCase()===w)return k}return String(c||"").trim().toLowerCase()}
function rollWin(ch){const n=Number(ch);const c=Number.isFinite(n)?n:50;const a=new Uint32Array(1);crypto.getRandomValues(a);return (a[0]%100)<c}

const board=$("board");
for(let i=0;i<25;i++){const b=document.createElement("button");b.className="cell";b.dataset.i=i;b.disabled=true;board.appendChild(b);}

onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("login.html");return}
  try{
    const uSnap=await getDoc(doc(db,"users",user.uid));
    if(!uSnap.exists()||uSnap.data().status==="blocked"){await signOut(auth);location.replace("login.html");return}
    let cfg={gameStatus:"enabled",coinId:"hfc",coinName:"HFC",minBet:1,maxBet:1000,maxMultiplier:50,winChance:50,mines:5};

    // ✅ LIVE SYNC: admin change karte hi foran update
    onSnapshot(doc(db,"settings","mines"),s=>{
      if(s.exists())cfg={...cfg,...s.data()};
      $("min").textContent=cfg.minBet;$("max").textContent=cfg.maxBet;
      $("bet").min=cfg.minBet;$("bet").max=cfg.maxBet;
      $("mines").value=String(cfg.mines||5);
      console.log("Mines settings loaded:",cfg);
    });

    let walletRef=doc(db,"wallets",user.uid);
    let wSnap=await getDoc(walletRef);
    if(!wSnap.exists()){try{await setDoc(walletRef,{balances:{hfc:0},createdAt:serverTimestamp()});}catch(e){}}

    onSnapshot(walletRef,s=>{const w=s.exists()?s.data():{};$("bal").textContent=readBalanceCaseInsensitive(w.balances||w.coins||{},cfg.coinId).toLocaleString();},()=>{$("bal").textContent="—"});
    onSnapshot(query(collection(db,"games"),where("uid","==",user.uid),limit(100)),s=>{
      const rows=s.docs.map(d=>d.data()).filter(x=>x.game==="mines").sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)).slice(0,20);
      $("history").innerHTML=rows.map(x=>`<tr><td>${x.createdAt?.toDate?.()?.toLocaleString()||"—"}</td><td>${x.stake??"—"} ${x.coinName||""}</td><td>${x.picks??0}</td><td>${x.cashedAt?x.cashedAt.toFixed(2)+"x":"—"}</td><td style="color:${x.outcome==="win"?"#7ee2a8":"#ff9d9d"}">${x.outcome==="win"?"CASHED":"MINE"}</td></tr>`).join("")||'<tr><td colspan="5">No rounds yet.</td></tr>';
    },()=>{$("history").innerHTML='<tr><td colspan="5">History unavailable.</td></tr>'});

    let phase="idle",stake=0,M=5,picks=0,mult=1,willWin=true,lossAt=1;
    function multiplier(k){let p=1;for(let i=0;i<k;i++){p*=(25-M-i)/(25-i);}return Math.max(1,Math.min(Number(cfg.maxMultiplier)||50,Math.floor((1/p)*0.97*100)/100));}
    function resetBoard(){[...board.children].forEach(c=>{c.className="cell";c.textContent="";c.disabled=true;});}
    function pick(i,btn){
      if(phase!=="playing")return;
      picks++;
      const isMine=!willWin && picks>=lossAt;
      if(isMine){btn.className="cell mine";btn.textContent="💥";btn.disabled=true;revealMines(i);return end(false,1);}
      else{btn.className="cell safe";btn.textContent="💎";btn.disabled=true;mult=multiplier(picks);$("mult").textContent=mult.toFixed(2)+"x";$("cash").disabled=false;$("cash").textContent=`💰 Cash Out ${(stake*mult).toFixed(2)}`;if(picks>=(25-M))return end(true,mult);}
    }
    function revealMines(skip){const idx=[...Array(25).keys()].filter(x=>x!==skip&&!board.children[x].classList.contains("safe"));idx.sort(()=>Math.random()-.5);idx.slice(0,M).forEach(x=>{board.children[x].className="cell mine";board.children[x].textContent="💣";board.children[x].disabled=true;});}
    [...board.children].forEach((c,i)=>{c.onclick=()=>pick(i,c);});

    $("start").onclick=()=>{
      if(phase==="playing")return;
      if(cfg.gameStatus!=="enabled"){showMsg("err","Game disabled hai.");return}
      stake=Number($("bet").value);
      if(!Number.isFinite(stake)||stake<Number(cfg.minBet)||stake>Number(cfg.maxBet)){showMsg("err","Bet limits ke andar enter karo.");return}
      M=Number($("mines").value)||5;
      willWin=rollWin(cfg.winChance);
      lossAt=1+Math.floor(Math.random()*3);
      phase="playing";picks=0;mult=1;
      $("mult").textContent="1.00x";
      resetBoard();
      [...board.children].forEach(c=>c.disabled=false);
      $("start").disabled=true;$("cash").disabled=true;$("bet").disabled=true;$("mines").disabled=true;
      $("msg").className="msg";
    };
    $("cash").onclick=()=>{if(phase==="playing"&&picks>0)end(true,mult);};

    async function end(won,payout){
      phase="ended";
      [...board.children].forEach(c=>c.disabled=true);
      $("cash").disabled=true;$("bet").disabled=false;$("mines").disabled=false;$("start").disabled=false;
      try{
        await runTransaction(db,async tx=>{
          const walletRef=doc(db,"wallets",user.uid);
          const statsRef=doc(db,"gameStats",user.uid);
          const wSnap=await tx.get(walletRef);
          const sSnap=await tx.get(statsRef);
          if(!wSnap.exists())throw new Error("Wallet not found.");
          const wData=wSnap.data();
          const field=("balances" in wData)?"balances":("coins" in wData)?"coins":"balances";
          const bals=wData[field]||{};
          const key=readBalanceKey(bals,cfg.coinId);
          const bal=Number(bals[key])||0;
          if(stake>bal)throw new Error("Insufficient balance.");
          const newBal=won?bal-stake+stake*payout:bal-stake;
          const gameRef=doc(collection(db,"games"));
          const rec={uid:user.uid,game:"mines",outcome:won?"win":"loss",stake,coinId:key,coinName:cfg.coinName,mines:M,picks,createdAt:serverTimestamp()};
          if(won){rec.cashedAt=payout;rec.payoutMultiplier=payout;}
          tx.set(gameRef,rec);
          tx.update(walletRef,{[field+"."+key]:newBal,lastGameId:gameRef.id,lastPlayedCoin:key,lastGame:"mines",lastGameAt:serverTimestamp()});
          if(sSnap.exists()){const o=sSnap.data();tx.update(statsRef,{totalGames:Number(o.totalGames||0)+1,wins:Number(o.wins||0)+(won?1:0),losses:Number(o.losses||0)+(won?0:1),lastGameId:gameRef.id});}
          else{tx.set(statsRef,{totalGames:1,wins:won?1:0,losses:won?0:1,lastGameId:gameRef.id});}
        });
        if(won)showMsg("ok",`Cashed out @ ${payout.toFixed(2)}x! +${(stake*payout-stake).toFixed(2)} ${cfg.coinName}`);
        else showMsg("err",`💣 Mine lag gayi! -${stake} ${cfg.coinName}`);
      }catch(err){console.error(err);showMsg("err",err?.code==="permission-denied"?"Rules ne reject kiya.":"Transaction fail.");}
    }
  }catch(err){console.error(err);$("bal").textContent="—";}
});
</script></body></html>
