<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rocket Crash</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1021;color:#e8e6f0;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{height:68px;background:#151a33;border-bottom:1px solid #2a3055}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#ffb84d;letter-spacing:.5px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{color:#9aa3d0;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.card{background:#151a33;border:1px solid #2a3055;border-radius:18px;padding:22px;box-shadow:0 10px 28px #00000040;margin-bottom:18px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{padding:17px;border:1px solid #2a3055;border-radius:13px;background:#10142a}.tile span{font-size:12px;color:#8b93b8}.tile b{display:block;font-size:24px;color:#ffb84d;margin-top:4px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #2a3055;border-radius:9px;background:#0d1021;color:#e8e6f0}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:linear-gradient(135deg,#ff9d3d,#e05b00);color:#fff}.cash{background:linear-gradient(135deg,#3ddc84,#0f9d58);color:#fff}.soft{background:#232a4d;color:#cdd3f0}.msg{display:none;padding:11px;border-radius:10px;margin:14px auto 0;font-size:13px;font-weight:700;max-width:560px}.show{display:block}.ok{background:#123524;color:#7ee2a8}.err{background:#3a1518;color:#ff9d9d}.small{font-size:12px;color:#8b93b8}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid #232a4d;font-size:13px}th{font-size:11px;color:#8b93b8;text-transform:uppercase}.stage{position:relative;height:300px;border-radius:14px;background:radial-gradient(1200px 300px at 70% -50%,#2a3055,#0d1021);overflow:hidden;border:1px solid #2a3055}canvas{width:100%;height:100%;display:block}.mult{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:56px;font-weight:900;color:#fff;text-shadow:0 4px 30px #000}.mult.crash{color:#ff5d5d}.mult.win{color:#3ddc84}.center{text-align:center}@media(max-width:780px){.tiles{grid-template-columns:1fr}.head{height:auto;min-height:68px;padding:10px 0}.top{height:auto}.nav{justify-content:flex-end}.page{padding-top:20px}.mult{font-size:40px}}</style></head><body><header class="top"><div class="wrap head"><div class="brand">🚀 ROCKET CRASH</div><div class="nav"><a href="index.html">Lobby</a><a href="coinflip.html">Coin Flip</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><section class="card"><div class="tiles"><div class="tile"><span>Balance</span><b id="bal">0</b></div><div class="tile"><span>Min Bet</span><b id="min">1</b></div><div class="tile"><span>Max Bet</span><b id="max">1000</b></div></div><div class="field" style="max-width:380px;margin:20px auto"><label>Bet Amount</label><input id="bet" type="number" min="1" step=".01" value="1"></div><div class="stage"><canvas id="cv"></canvas><div id="mult" class="mult">1.00x</div></div><p class="small center" style="margin-top:10px">Rocket crash hone se pehle Cash Out karo! Max multiplier: <b id="maxm">—</b></p><div class="center" style="margin-top:12px"><button id="launch" class="btn primary">🚀 Launch Rocket</button> <button id="cash" class="btn cash" disabled>💰 Cash Out</button></div><div id="msg" class="msg"></div></section><section class="card"><h2 style="color:#e8e6f0">Recent Rounds</h2><div class="table"><table><thead><tr><th>Time</th><th>Stake</th><th>Cashed At</th><th>Crash Point</th><th>Outcome</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script type="module">const firebaseConfig={
  apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",
  authDomain:"mr777-c72fc.firebaseapp.com",
  projectId:"mr777-c72fc",
  storageBucket:"mr777-c72fc.firebasestorage.app",
  messagingSenderId:"1027130368908",
  appId:"1:1027130368908:web:7e3cf883e137935523eca9",
  measurementId:"G-3GTQHMNF9"
};

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,onSnapshot,collection,query,where,limit,orderBy,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
$("logout").onclick=async()=>{await signOut(auth);location.replace("login.html")};

function showMsg(t,x){const m=$("msg");m.className="msg show "+t;m.textContent=x;if(t==="ok")setTimeout(()=>{m.className="msg"},4000);}
function readBalanceCaseInsensitive(b,c){const w=String(c||"").trim().toLowerCase();for(const[k,v]of Object.entries(b||{})){if(String(k).trim().toLowerCase()===w)return Number(v)||0}return 0}
function readBalanceKey(b,c){const w=String(c||"").trim().toLowerCase();for(const k of Object.keys(b||{})){if(String(k).trim().toLowerCase()===w)return k}return String(c||"").trim().toLowerCase()}

const cv=$("cv"),ctx=cv.getContext("2d");
function fit(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;}
window.addEventListener("resize",fit);

onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("login.html");return}
  try{
    const uSnap=await getDoc(doc(db,"users",user.uid));
    if(!uSnap.exists()||uSnap.data().status==="blocked"){await signOut(auth);location.replace("login.html");return}

    let cfg={gameStatus:"enabled",coinId:"hfc",coinName:"HFC",minBet:1,maxBet:1000,maxMultiplier:50};
    const cf=await getDoc(doc(db,"settings","coinflip"));
    if(cf.exists()) cfg={...cfg,coinId:cf.data().coinId||cfg.coinId,coinName:cf.data().coinName||cfg.coinName};
    const cs=await getDoc(doc(db,"settings","crash"));
    if(cs.exists()) cfg={...cfg,...cs.data()};

    $("min").textContent=cfg.minBet;$("max").textContent=cfg.maxBet;
    $("maxm").textContent=cfg.maxMultiplier+"x";
    $("bet").min=cfg.minBet;$("bet").max=cfg.maxBet;$("bet").value=cfg.minBet;

    onSnapshot(doc(db,"wallets",user.uid),s=>{
      const w=s.exists()?s.data():{};
      $("bal").textContent=readBalanceCaseInsensitive(w.balances||w.coins||{},cfg.coinId).toLocaleString();
    },()=>{$("bal").textContent="—"});

    onSnapshot(query(collection(db,"games"),where("uid","==",user.uid),limit(100)),s=>{
      const rows=s.docs.map(d=>d.data()).filter(x=>x.game==="crash")
        .sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)).slice(0,20);
      $("history").innerHTML=rows.map(x=>`<tr>
        <td>${x.createdAt?.toDate?.()?.toLocaleString()||"—"}</td>
        <td>${x.stake??"—"} ${x.coinName||""}</td>
        <td>${x.cashedAt?x.cashedAt.toFixed(2)+"x":"—"}</td>
        <td style="color:#ff9d9d">${(x.crashPoint??0).toFixed(2)}x</td>
        <td style="color:${x.outcome==="win"?"#7ee2a8":"#ff9d9d"}">${x.outcome==="win"?"CASHED":"CRASHED"}</td>
      </tr>`).join("")||'<tr><td colspan="5">No rounds yet.</td></tr>';
    },()=>{$("history").innerHTML='<tr><td colspan="5">History unavailable.</td></tr>'});

    // ---- GAME ENGINE ----
    let phase="idle",startTs=0,crashPoint=1,raf=0,pts=[],stake=0,curM=1;
    const growth=ms=>Math.pow(1.00024,ms);
    function genCrash(){
      const r=Math.random();
      if(r<0.03) return 1.00;
      let m=0.97/(1-r);
      return Math.max(1.00,Math.min(Number(cfg.maxMultiplier)||50,Math.floor(m*100)/100));
    }
    function draw(m,crashed){
      fit();
      const w=cv.width,h=cv.height;
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle="#232a4d";ctx.lineWidth=1;
      for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(0,h*i/5);ctx.lineTo(w,h*i/5);ctx.stroke();}
      if(pts.length>1){
        const maxT=pts[pts.length-1].t||1,maxM=Math.max(m,2);
        ctx.beginPath();
        pts.forEach((p,i)=>{
          const x=20+(p.t/maxT)*(w-50);
          const y=h-25-((p.m-1)/(maxM-1))*(h-60);
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        });
        ctx.strokeStyle=crashed?"#ff5d5d":"#ffb84d";ctx.lineWidth=3;ctx.stroke();
        const lp=pts[pts.length-1];
        const x=20+(lp.t/maxT)*(w-50),y=h-25-((lp.m-1)/(maxM-1))*(h-60);
        ctx.font="26px serif";ctx.fillText(crashed?"💥":"🚀",x-13,y+9);
      }
    }
    function loop(){
      const t=performance.now()-startTs;
      curM=growth(t);
      if(curM>=crashPoint){
        pts.push({t,m:crashPoint});draw(crashPoint,true);
        return end(false,crashPoint,null);
      }
      pts.push({t,m:curM});draw(curM,false);
      $("mult").textContent=curM.toFixed(2)+"x";
      $("mult").className="mult";
      $("cash").textContent=`💰 Cash Out ${(stake*curM).toFixed(2)}`;
      raf=requestAnimationFrame(loop);
    }
    async function end(won,cp,cashMult){
      phase="ended";cancelAnimationFrame(raf);
      $("cash").disabled=true;$("bet").disabled=false;
      const mEl=$("mult");
      if(won){mEl.textContent=cashMult.toFixed(2)+"x";mEl.className="mult win";}
      else{mEl.textContent="CRASHED @ "+cp.toFixed(2)+"x";mEl.className="mult crash";}

      try{
        await runTransaction(db,async tx=>{
          const walletRef=doc(db,"wallets",user.uid);
          const statsRef=doc(db,"gameStats",user.uid);
          const wSnap=await tx.get(walletRef);
          const sSnap=await tx.get(statsRef);
          if(!wSnap.exists()) throw new Error("Wallet not found.");
          const wData=wSnap.data();
          const field=("balances" in wData)?"balances":("coins" in wData)?"coins":"balances";
          const bals=wData[field]||{};
          const key=readBalanceKey(bals,cfg.coinId);
          const bal=Number(bals[key])||0;
          if(stake>bal) throw new Error("Insufficient balance.");
          const newBal=won ? bal-stake+stake*cashMult : bal-stake;

          const gameRef=doc(collection(db,"games"));
          const rec={
            uid:user.uid,game:"crash",
            outcome:won?"win":"loss",
            stake,coinId:key,coinName:cfg.coinName,
            crashPoint:cp,
            createdAt:serverTimestamp()
          };
          if(won){rec.cashedAt=cashMult;rec.payoutMultiplier=cashMult;}
          tx.set(gameRef,rec);

          tx.update(walletRef,{
            [field+"."+key]:newBal,
            lastGameId:gameRef.id,
            lastPlayedCoin:key,
            lastGame:"crash",
            lastGameAt:serverTimestamp()
          });

          if(sSnap.exists()){
            const o=sSnap.data();
            tx.update(statsRef,{
              totalGames:Number(o.totalGames||0)+1,
              wins:Number(o.wins||0)+(won?1:0),
              losses:Number(o.losses||0)+(won?0:1),
              lastGameId:gameRef.id
            });
          }else{
            tx.set(statsRef,{totalGames:1,wins:won?1:0,losses:won?0:1,lastGameId:gameRef.id});
          }
        });
        if(won) showMsg("ok",`Cashed out @ ${cashMult.toFixed(2)}x! +${(stake*cashMult-stake).toFixed(2)} ${cfg.coinName}`);
        else showMsg("err",`Rocket crashed @ ${cp.toFixed(2)}x! -${stake} ${cfg.coinName}`);
      }catch(err){
        console.error(err);
        showMsg("err",err?.code==="permission-denied"?"Rules ne transaction reject kiya. Naye rules publish karein aur admin-crash.html se settings save karein.":(err?.message||"Transaction fail."));
      }finally{
        $("launch").disabled=false;
      }
    }

    $("launch").onclick=()=>{
      if(phase==="flying") return;
      if(cfg.gameStatus!=="enabled"){showMsg("err","Game disabled hai.");return}
      stake=Number($("bet").value);
      if(!Number.isFinite(stake)||stake<Number(cfg.minBet)||stake>Number(cfg.maxBet)){showMsg("err","Bet limits ke andar enter karo.");return}
      phase="flying";pts=[];startTs=performance.now();
      crashPoint=genCrash();curM=1;
      $("launch").disabled=true;$("cash").disabled=false;$("bet").disabled=true;
      $("msg").className="msg";
      raf=requestAnimationFrame(loop);
    };
    $("cash").onclick=()=>{
      if(phase!=="flying") return;
      phase="cashing";cancelAnimationFrame(raf);
      const cashMult=Math.max(1,Math.floor(curM*100)/100);
      pts.push({t:performance.now()-startTs,m:cashMult});
      draw(cashMult,false);
      end(true,crashPoint,cashMult);
    };

    fit();draw(1,false);
  }catch(err){console.error(err);$("bal").textContent="—";}
});
</script></body></html>
