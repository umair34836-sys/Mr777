<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1120px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:#8d632b}.page{padding:28px 0 50px}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.soft{background:#eee6da}.danger{background:#b63e39;color:#fff}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #e5dbcc;border-radius:9px;background:#fff}.form{max-width:450px;margin:35px auto}.form h1{text-align:center}.form .btn{width:100%}.sub,.small{color:#81786d;font-size:13px}.sub{text-align:center}.msg{display:none;padding:11px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:700}.show{display:block}.err{background:#fff0ef;color:#963530}.ok{background:#edf8f1;color:#286f43}.account{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.user{display:flex;align-items:center;gap:11px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#a77b3b;color:#fff;font-weight:900}.balance{text-align:right}.balance b{display:block;font-size:24px;color:#8d632b}.coin{width:155px;height:155px;border-radius:50%;margin:28px auto 18px;display:grid;place-items:center;font-size:46px;font-weight:900;color:#855d26;background:radial-gradient(circle at 30% 25%,#fff,#ead5ab 55%,#a77430);border:8px solid #b78a4b;box-shadow:0 12px 28px #62441b22}.spin{animation:spin .8s ease}@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1800deg)}}.choices{display:flex;justify-content:center;gap:9px}.bet{max-width:380px;margin:18px auto}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;border:1px solid #e7ddcf;border-radius:11px;background:#faf6ef}.stat span{display:block;font-size:11px;color:#81786d}.stat b{font-size:19px}.green{color:#25814b}.red{color:#b63e39}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee6da;font-size:13px}th{font-size:11px;color:#81786d}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid #e5dbcc;background:#fff;padding:10px 12px;border-radius:9px;font-weight:800}.active{background:#8d632b;color:#fff}.hide{display:none!important}.adminstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.action{display:flex;gap:5px;flex-wrap:wrap}.action .btn{padding:7px 9px;font-size:12px}@media(max-width:780px){.grid,.adminstats{grid-template-columns:1fr}.account{align-items:flex-start;flex-direction:column}.balance{text-align:left}}</style></head><body><header class="top"><div class="wrap head"><div class="brand">ADMIN DASHBOARD</div><button id="logout" class="btn danger">Logout</button></div></header><main class="wrap page"><div id="msg" class="msg"></div><div class="adminstats"><div class="card"><span class="small">Users</span><h2 id="count">0</h2></div><div class="card"><span class="small">Game</span><h2>Coin Flip</h2></div><div class="card"><span class="small">Coin</span><h2 id="coinStat">—</h2></div></div><div class="tabs"><button class="tab active" data-p="dashboard">Dashboard</button><button class="tab" data-p="users">Users</button><button class="tab" data-p="game">Game Settings</button><button class="tab" data-p="coin">Coin Settings</button></div><section id="dashboard" class="card pane"><h2>Dashboard</h2><p class="small">Live Firebase admin controls.</p></section><section id="users" class="card pane hide"><h2>User Management</h2><div class="table"><table><thead><tr><th>User</th><th>Email</th><th>Status</th><th>Balance</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div></section><section id="game" class="card pane hide"><h2>Coin Flip Settings</h2><div class="grid"><div class="field"><label>Status</label><select id="status"><option value="enabled">Enabled</option><option value="disabled">Disabled</option></select></div><div class="field"><label>Winning Chance %</label><input id="win" type="number" min="0" max="100" step=".01"></div><div class="field"><label>Loss Chance %</label><input id="loss" disabled></div><div class="field"><label>Minimum Bet</label><input id="min" type="number" step=".01"></div><div class="field"><label>Maximum Bet</label><input id="max" type="number" step=".01"></div><div class="field"><label>Payout Multiplier</label><input id="payout" type="number" min="1" step=".01"></div></div><button id="saveGame" class="btn primary">Save Game Settings</button></section><section id="coin" class="card pane hide"><h2>Coin Settings</h2><div class="grid"><div class="field"><label>Coin ID</label><input id="coinId"></div><div class="field"><label>Coin Name</label><input id="coinName"></div><div class="field"><label>PKR Value</label><input id="value" type="number" step=".000001"></div></div><p class="small">Example: HFC value 2 = 1 HFC is 2 PKR.</p><button id="saveCoin" class="btn primary">Save Coin</button></section></main><script type="module">const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,updateDoc,collection,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let cid="hfc",users=[];const $=x=>document.getElementById(x),msg=(t,e=false)=>{$("msg").textContent=t;$("msg").className="msg show "+(e?"err":"ok")};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".pane").forEach(x=>x.classList.add("hide"));$(b.dataset.p).classList.remove("hide")});async function load(){const x=await getDoc(doc(db,"settings","coinflip"));const d=x.exists()?x.data():{gameStatus:"enabled",coinId:"hfc",coinName:"HFC",coinValuePKR:1,minBet:1,maxBet:100,winChance:50,payoutMultiplier:2};cid=d.coinId;$("status").value=d.gameStatus;$("coinId").value=d.coinId;$("coinName").value=d.coinName;$("value").value=d.coinValuePKR;$("min").value=d.minBet;$("max").value=d.maxBet;$("win").value=d.winChance;$("loss").value=100-d.winChance;$("payout").value=d.payoutMultiplier;$("coinStat").textContent=d.coinName+" · "+d.coinValuePKR+" PKR"}function render(){$("count").textContent=users.length;$("usersBody").innerHTML=users.map(u=>{const b=Number((u.coins||{})[cid]||0);return `<tr><td>${u.username||""}</td><td>${u.email||""}</td><td>${u.status||"active"}</td><td>${b} ${cid}</td><td class="action"><button class="btn primary" data-add="${u.uid}">Add</button><button class="btn danger" data-rem="${u.uid}">Remove</button><button class="btn soft" data-block="${u.uid}">${u.status==="blocked"?"Unblock":"Block"}</button></td></tr>`}).join("")}async function adjust(uid,dir){const n=Number(prompt(dir>0?"Add amount":"Remove amount","1"));if(!n||n<=0)return;const r=doc(db,"users",uid),x=await getDoc(r),u=x.data(),c={...(u.coins||{})},v=Number(c[cid]||0)+dir*n;if(v<0)return msg("Balance negative nahi ho sakta.",true);c[cid]=v;await updateDoc(r,{coins:c,updatedAt:serverTimestamp()});msg("Balance updated.")}$("win").oninput=()=>$("loss").value=(100-Number($("win").value||0)).toFixed(2);$("saveGame").onclick=async()=>{await setDoc(doc(db,"settings","coinflip"),{gameStatus:$("status").value,coinId:$("coinId").value.trim()||"hfc",coinName:$("coinName").value.trim()||"HFC",coinValuePKR:Number($("value").value)||1,minBet:Number($("min").value)||1,maxBet:Number($("max").value)||100,winChance:Number($("win").value),payoutMultiplier:Number($("payout").value)||2,updatedAt:serverTimestamp()},{merge:true});await load();render();msg("Game settings saved.")};$("saveCoin").onclick=()=>$("saveGame").click();$("logout").onclick=async()=>{await signOut(auth);location.href="login.html"};document.addEventListener("click",async e=>{if(e.target.dataset.add)await adjust(e.target.dataset.add,1);if(e.target.dataset.rem)await adjust(e.target.dataset.rem,-1);if(e.target.dataset.block){const r=doc(db,"users",e.target.dataset.block),x=await getDoc(r);await updateDoc(r,{status:x.data().status==="blocked"?"active":"blocked",updatedAt:serverTimestamp()})}});onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";const x=await getDoc(doc(db,"users",u.uid));if(!x.exists()||x.data().isAdmin!==true)return location.href="index.html";await load();onSnapshot(collection(db,"users"),s=>{users=s.docs.map(d=>d.data());render()})});</script></body></html>
