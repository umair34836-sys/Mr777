<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coin Flip</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#8d632b;letter-spacing:.5px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{color:#6e522d;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12;margin-bottom:18px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{padding:17px;border:1px solid #e5dbcc;border-radius:13px;background:#faf6ef}.tile span{font-size:12px;color:#81786d}.tile b{display:block;font-size:24px;color:#8d632b;margin-top:4px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #e5dbcc;border-radius:9px;background:#fff;color:#29231d}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.soft{background:#eee6da;color:#392d20}.msg{display:none;padding:11px;border-radius:10px;margin:14px auto 0;font-size:13px;font-weight:700;max-width:520px}.show{display:block}.ok{background:#edf8f1;color:#286f43}.err{background:#fff0ef;color:#963530}.small{font-size:12px;color:#81786d}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee6da;font-size:13px}th{font-size:11px;color:#81786d;text-transform:uppercase}.coin{width:150px;height:150px;border-radius:50%;margin:25px auto 15px;display:grid;place-items:center;font-size:44px;font-weight:900;color:#855d26;background:radial-gradient(circle at 30% 25%,#fff,#ead5ab 55%,#a77430);border:8px solid #b78a4b;box-shadow:0 12px 28px #62441b22}.spin{animation:spin .8s ease}@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1800deg)}}.center{text-align:center}@media(max-width:780px){.tiles{grid-template-columns:1fr}.head{height:auto;min-height:68px;padding:10px 0}.top{height:auto}.nav{justify-content:flex-end}.page{padding-top:20px}}</style></head><body><header class="top"><div class="wrap head"><div class="brand">COIN FLIP</div><div class="nav"><a href="index.html">Lobby</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><a href="withdrawal.html">Withdrawal</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><section class="card center"><h1>Coin Flip</h1><p class="small">Apni bet amount enter karo aur Heads ya Tails choose karo.</p><div class="tiles"><div class="tile"><span>Balance</span><b id="bal">0</b></div><div class="tile"><span>Min Bet</span><b id="min">1</b></div><div class="tile"><span>Max Bet</span><b id="max">100</b></div></div><div class="field" style="max-width:380px;margin:20px auto"><label>Bet Amount</label><input id="bet" type="number" min="1" step=".01" value="1"></div><div id="coin" class="coin">?</div><h3 id="result">Choose your side</h3><button id="heads" class="btn primary">Heads</button> <button id="tails" class="btn soft">Tails</button><div id="msg" class="msg"></div></section><section class="card"><h2>Statistics</h2><div class="tiles"><div class="tile"><span>Total Games</span><b id="games">0</b></div><div class="tile"><span>Wins</span><b id="wins">0</b></div><div class="tile"><span>Losses</span><b id="losses">0</b></div><div class="tile"><span>Win Rate</span><b id="rate">0%</b></div></div></section><section class="card"><h2>Recent Games</h2><div class="table"><table><thead><tr><th>Time</th><th>Choice</th><th>Result</th><th>Outcome</th><th>Stake</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script type="module">const firebaseConfig={
  apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",
  authDomain:"mr777-c72fc.firebaseapp.com",
  projectId:"mr777-c72fc",
  storageBucket:"mr777-c72fc.firebasestorage.app",
  messagingSenderId:"1027130368908",
  appId:"1:1027130368908:web:7e3cf883e137935523eca9",
  measurementId:"G-3GTQHMNF9"
};

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,onSnapshot,collection,query,where,orderBy,limit,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

$("logout").onclick=async()=>{await signOut(auth);location.replace("login.html")};

function showMsg(type,text){
  const m=$("msg");
  m.className="msg show "+type;
  m.textContent=text;
  if(type==="ok") setTimeout(()=>{m.className="msg"},4000);
}
function readBalanceCaseInsensitive(balances,coinId){
  const wanted=String(coinId||"").trim().toLowerCase();
  for(const [key,value] of Object.entries(balances||{})){
    if(String(key).trim().toLowerCase()===wanted) return Number(value)||0;
  }
  return 0;
}
function readBalanceKey(balances,coinId){
  const wanted=String(coinId||"").trim().toLowerCase();
  for(const key of Object.keys(balances||{})){
    if(String(key).trim().toLowerCase()===wanted) return key;
  }
  return String(coinId||"").trim().toLowerCase();
}
// FIX: Ab winChance = PLAYER ke jeetne ka chance (Heads ya Tails dono par same)
function rollWin(winChance){
  const a=new Uint32Array(1);
  crypto.getRandomValues(a);
  return (a[0]%100) < Number(winChance??50);
}

onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("login.html");return}
  try{
    const userSnap=await getDoc(doc(db,"users",user.uid));
    if(!userSnap.exists()){await signOut(auth);location.replace("login.html");return}
    if(userSnap.data().status==="blocked"){await signOut(auth);location.replace("login.html");return}

    let cfg={gameStatus:"enabled",coinId:"hfc",coinName:"HFC",minBet:1,maxBet:1000,winChance:50,payoutMultiplier:2};
    const settingsSnap=await getDoc(doc(db,"settings","coinflip"));
    if(settingsSnap.exists()) cfg={...cfg,...settingsSnap.data()};

    $("min").textContent=cfg.minBet;
    $("max").textContent=cfg.maxBet;
    $("bet").min=cfg.minBet;
    $("bet").max=cfg.maxBet;
    $("bet").value=cfg.minBet;

    onSnapshot(doc(db,"wallets",user.uid),snap=>{
      const w=snap.exists()?snap.data():{};
      const balances=w.balances||w.coins||{};
      $("bal").textContent=readBalanceCaseInsensitive(balances,cfg.coinId).toLocaleString();
    },err=>{console.error("Wallet error:",err);$("bal").textContent="—";});

    onSnapshot(doc(db,"gameStats",user.uid),snap=>{
      const s=snap.exists()?snap.data():{};
      const total=Number(s.totalGames||0),wins=Number(s.wins||0),losses=Number(s.losses||0);
      $("games").textContent=total.toLocaleString();
      $("wins").textContent=wins.toLocaleString();
      $("losses").textContent=losses.toLocaleString();
      $("rate").textContent=(total?(wins/total*100).toFixed(1):"0")+"%";
    },err=>console.error("Stats error:",err));

    const q=query(collection(db,"games"),where("uid","==",user.uid),orderBy("createdAt","desc"),limit(30));
    onSnapshot(q,snap=>{
      $("history").innerHTML=snap.docs.map(d=>{
        const x=d.data();
        return `<tr>
          <td>${x.createdAt?.toDate?.()?.toLocaleString()||"—"}</td>
          <td>${x.choice||"—"}</td>
          <td>${x.result||"—"}</td>
          <td>${x.outcome||"—"}</td>
          <td>${x.stake??"—"} ${x.coinName||cfg.coinName}</td>
        </tr>`;
      }).join("")||'<tr><td colspan="5">No games yet.</td></tr>';
    },err=>{
      console.error("History error:",err);
      $("history").innerHTML='<tr><td colspan="5">Game history unavailable.</td></tr>';
    });

    let busy=false;
    const setButtons=v=>{$("heads").disabled=v;$("tails").disabled=v;};

    async function play(choice){
      if(busy) return;
      if(cfg.gameStatus!=="enabled"){showMsg("err","Game disabled hai.");return}

      const stake=Number($("bet").value);
      if(!Number.isFinite(stake)||stake<Number(cfg.minBet)||stake>Number(cfg.maxBet)){
        showMsg("err","Bet amount limits ke andar enter karo.");return;
      }

      busy=true;setButtons(true);
      $("msg").className="msg";
      $("result").textContent="Flipping…";
      $("result").style.color="";
      $("coin").textContent="…";
      $("coin").classList.add("spin");

      // FIX: Pehle win/loss decide hota hai winChance se,
      // phir result usi ke mutabiq (win = choice, loss = opposite)
      const won=rollWin(cfg.winChance);
      const result=won ? choice : (choice==="Heads"?"Tails":"Heads");

      try{
        await runTransaction(db,async tx=>{
          const walletRef=doc(db,"wallets",user.uid);
          const statsRef=doc(db,"gameStats",user.uid);
          const wSnap=await tx.get(walletRef);
          const sSnap=await tx.get(statsRef);
          if(!wSnap.exists()) throw new Error("Wallet document not found.");

          const wData=wSnap.data();
          const field=("balances" in wData)?"balances":("coins" in wData)?"coins":"balances";
          const bals=wData[field]||{};
          const key=readBalanceKey(bals,cfg.coinId);
          const bal=Number(bals[key])||0;
          if(stake>bal) throw new Error("Insufficient balance.");

          const mult=Number(cfg.payoutMultiplier||2);
          const newBal=won ? bal-stake+stake*mult : bal-stake;

          const gameRef=doc(collection(db,"games"));
          tx.set(gameRef,{
            uid:user.uid,
            game:"coinflip",
            choice:choice,
            result:result,
            outcome:won?"win":"loss",
            stake:stake,
            coinId:key,
            coinName:cfg.coinName,
            createdAt:serverTimestamp()
          });

          tx.update(walletRef,{
            [field+"."+key]:newBal,
            lastGameId:gameRef.id,
            lastPlayedCoin:key,
            lastGame:"coinflip",
            lastGameAt:serverTimestamp()
          });

          if(sSnap.exists()){
            const o=sSnap.data();
            tx.update(statsRef,{
              totalGames:Number(o.totalGames||0)+1,
              wins:Number(o.wins||0)+(won?1:0),
              losses:Number(o.losses||0)+(won?0:1),
              lastGameId:gameRef.id
            });
          }else{
            tx.set(statsRef,{totalGames:1,wins:won?1:0,losses:won?0:1,lastGameId:gameRef.id});
          }
        });

        setTimeout(()=>{
          $("coin").classList.remove("spin");
          $("coin").textContent=result==="Heads"?"H":"T";
          const mult=Number(cfg.payoutMultiplier||2);
          if(won){
            const profit=stake*mult-stake;
            $("result").textContent=`Result: ${result} — You WON +${profit.toLocaleString()} ${cfg.coinName}`;
            $("result").style.color="#286f43";
            showMsg("ok",`Win! +${profit.toLocaleString()} ${cfg.coinName}`);
          }else{
            $("result").textContent=`Result: ${result} — You LOST -${stake.toLocaleString()} ${cfg.coinName}`;
            $("result").style.color="#963530";
            showMsg("err",`Loss! -${stake.toLocaleString()} ${cfg.coinName}`);
          }
        },800);
      }catch(err){
        console.error(err);
        $("coin").classList.remove("spin");
        $("coin").textContent="?";
        $("result").textContent="Choose your side";
        showMsg("err",
          err?.code==="permission-denied"
            ? "Rules ne transaction reject kar diya. Firebase console mein function-based rules Publish karein."
            : (err?.message||"Transaction fail ho gayi. Dobara try karo."));
      }finally{
        busy=false;setButtons(false);
      }
    }

    $("heads").onclick=()=>play("Heads");
    $("tails").onclick=()=>play("Tails");

  }catch(err){
    console.error(err);
    $("bal").textContent="—";
    $("result").textContent="Account data load nahi hua";
  }
});
</script></body></html>
