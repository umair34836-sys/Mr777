<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coin Flip</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#29231d;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.top{height:68px;background:#fffdf9;border-bottom:1px solid #e5dbcc}.head{height:100%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:#8d632b;letter-spacing:.5px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{color:#6e522d;text-decoration:none;font-weight:800;font-size:13px}.page{padding:28px 0 55px}.card{background:#fffdf9;border:1px solid #e5dbcc;border-radius:18px;padding:22px;box-shadow:0 10px 28px #51391a12;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{padding:17px;border:1px solid #e5dbcc;border-radius:13px;background:#faf6ef}.tile span{font-size:12px;color:#81786d}.tile b{display:block;font-size:24px;color:#8d632b;margin-top:4px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #e5dbcc;border-radius:9px;background:#fff;color:#29231d}.field textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#c49b5d,#8d632b);color:#fff}.soft{background:#eee6da;color:#392d20}.danger{background:#b63e39;color:#fff}.msg{display:none;padding:11px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:700}.show{display:block}.ok{background:#edf8f1;color:#286f43}.err{background:#fff0ef;color:#963530}.small{font-size:12px;color:#81786d}.muted{color:#81786d}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee6da;font-size:13px}th{font-size:11px;color:#81786d;text-transform:uppercase}.actions{display:flex;gap:6px;flex-wrap:wrap}.coin{width:150px;height:150px;border-radius:50%;margin:25px auto 15px;display:grid;place-items:center;font-size:44px;font-weight:900;color:#855d26;background:radial-gradient(circle at 30% 25%,#fff,#ead5ab 55%,#a77430);border:8px solid #b78a4b;box-shadow:0 12px 28px #62441b22}.spin{animation:spin .8s ease}@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1800deg)}}.center{text-align:center}.gamecard{cursor:pointer;transition:.15s}.gamecard:hover{transform:translateY(-2px)}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;background:#eee6da}.active{background:#edf8f1;color:#286f43}.soon{background:#f2eadc;color:#8d632b}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.adminnav a{padding:9px 12px;border-radius:9px;background:#eee6da;text-decoration:none;color:#392d20;font-size:12px;font-weight:800}@media(max-width:780px){.grid,.tiles{grid-template-columns:1fr}.head{height:auto;min-height:68px;padding:10px 0}.top{height:auto}.nav{justify-content:flex-end}.page{padding-top:20px}}
</style></head><body><header class="top"><div class="wrap head"><div class="brand">COIN FLIP</div><div class="nav"><a href="index.html">Lobby</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><a href="withdrawal.html">Withdrawal</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><section class="card center"><h1>Coin Flip</h1><p class="small">Apni bet amount enter karo aur Heads ya Tails choose karo.</p><div class="tiles"><div class="tile"><span>Balance</span><b id="bal">0</b></div><div class="tile"><span>Min Bet</span><b id="min">1</b></div><div class="tile"><span>Max Bet</span><b id="max">100</b></div></div><div class="field" style="max-width:380px;margin:20px auto"><label>Bet Amount</label><input id="bet" type="number" min="1" step=".01" value="1"></div><div id="coin" class="coin">?</div><h3 id="result">Choose your side</h3><button id="heads" class="btn primary">Heads</button> <button id="tails" class="btn soft">Tails</button></section><section class="card"><h2>Statistics</h2><div class="tiles"><div class="tile"><span>Total Games</span><b id="games">0</b></div><div class="tile"><span>Wins</span><b id="wins">0</b></div><div class="tile"><span>Losses</span><b id="losses">0</b></div><div class="tile"><span>Win Rate</span><b id="rate">0%</b></div></div></section><section class="card"><h2>Recent Games</h2><div class="table"><table><thead><tr><th>Time</th><th>Choice</th><th>Result</th><th>Outcome</th><th>Stake</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script type="module">const firebaseConfig={
  apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",
  authDomain:"mr777-c72fc.firebaseapp.com",
  projectId:"mr777-c72fc",
  storageBucket:"mr777-c72fc.firebasestorage.app",
  messagingSenderId:"1027130368908",
  appId:"1:1027130368908:web:7e3cf883e137935523eca9",
  measurementId:"G-3GTQHMNF9"
};

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,onSnapshot,collection,query,where,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

$("logout").onclick=async()=>{await signOut(auth);location.replace("login.html")};

function readBalanceCaseInsensitive(balances, coinId){
  const wanted=String(coinId||"").trim().toLowerCase();
  for(const [key,value] of Object.entries(balances||{})){
    if(String(key).trim().toLowerCase()===wanted) return Number(value)||0;
  }
  return 0;
}

function readBalanceKey(balances, coinId){
  const wanted=String(coinId||"").trim().toLowerCase();
  for(const key of Object.keys(balances||{})){
    if(String(key).trim().toLowerCase()===wanted) return key;
  }
  return String(coinId||"").trim().toLowerCase();
}

onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("login.html");return}

  try{
    const userSnap=await getDoc(doc(db,"users",user.uid));
    if(!userSnap.exists()){await signOut(auth);location.replace("login.html");return}
    const userData=userSnap.data();
    if(userData.status==="blocked"){await signOut(auth);location.replace("login.html");return}

    let cfg={
      gameStatus:"enabled",
      coinId:"hfc",
      coinName:"HFC",
      minBet:1,
      maxBet:1000,
      winChance:50,
      payoutMultiplier:2
    };

    const settingsSnap=await getDoc(doc(db,"settings","coinflip"));
    if(settingsSnap.exists()) cfg={...cfg,...settingsSnap.data()};

    $("min").textContent=cfg.minBet;
    $("max").textContent=cfg.maxBet;
    $("bet").min=cfg.minBet;
    $("bet").max=cfg.maxBet;

    let currentWallet={};
    let currentStats={};

    // Wallet is the source of truth.
    onSnapshot(doc(db,"wallets",user.uid),snap=>{
      currentWallet=snap.exists()?snap.data():{};
      const balances=currentWallet.balances||currentWallet.coins||{};
      const balance=readBalanceCaseInsensitive(balances,cfg.coinId);
      $("bal").textContent=balance.toLocaleString();
      $("bal").dataset.coinKey=readBalanceKey(balances,cfg.coinId);
    },err=>{
      console.error("Wallet error:",err);
      $("bal").textContent="—";
    });

    // Stats are the source of truth.
    onSnapshot(doc(db,"gameStats",user.uid),snap=>{
      currentStats=snap.exists()?snap.data():{};
      const total=Number(currentStats.totalGames||0);
      const wins=Number(currentStats.wins||0);
      const losses=Number(currentStats.losses||0);
      $("games").textContent=total.toLocaleString();
      $("wins").textContent=wins.toLocaleString();
      $("losses").textContent=losses.toLocaleString();
      $("rate").textContent=(total?(wins/total*100).toFixed(1):"0")+"%";
    },err=>{
      console.error("Stats error:",err);
    });

    // Keep game history realtime.
    const q=query(
      collection(db,"games"),
      where("uid","==",user.uid),
      orderBy("createdAt","desc"),
      limit(30)
    );

    onSnapshot(q,snap=>{
      $("history").innerHTML=snap.docs.map(d=>{
        const x=d.data();
        return `<tr>
          <td>${x.createdAt?.toDate?.()?.toLocaleString()||"—"}</td>
          <td>${x.choice||"—"}</td>
          <td>${x.result||"—"}</td>
          <td>${x.outcome||"—"}</td>
          <td>${x.stake??"—"} ${x.coinName||cfg.coinName}</td>
        </tr>`;
      }).join("")||'<tr><td colspan="5">No games yet.</td></tr>';
    },err=>{
      console.error("History error:",err);
      $("history").innerHTML='<tr><td colspan="5">Game history unavailable.</td></tr>';
    });

    async function play(choice){
      // IMPORTANT: With the current Firestore-only security model,
      // users cannot securely write wallet/gameStats from the browser.
      // Do not fake a successful result or change a displayed balance locally.
      if(cfg.gameStatus!=="enabled"){alert("Game disabled hai.");return}
      const stake=Number($("bet").value);
      const balances=currentWallet.balances||currentWallet.coins||{};
      const balance=readBalanceCaseInsensitive(balances,cfg.coinId);

      if(!Number.isFinite(stake)||stake<Number(cfg.minBet)||stake>Number(cfg.maxBet)){
        alert("Bet amount limits ke andar enter karo.");
        return;
      }
      if(stake>balance){
        alert("Insufficient balance.");
        return;
      }

      alert("Balance ab wallet se correctly load ho raha hai. Coin Flip ka secure bet transaction browser-only Firebase setup mein complete nahi kiya ja sakta, kyunki wallet aur gameStats user ke liye write-protected hain.");
    }

    $("heads").onclick=()=>play("Heads");
    $("tails").onclick=()=>play("Tails");

  }catch(err){
    console.error(err);
    $("bal").textContent="—";
    $("result").textContent="Account data load nahi hua";
  }
});
</script></body></html>
