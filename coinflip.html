<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coin Flip</title><style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#3a7bd5 0%,#7ec3e8 22%,#ffd9a0 48%,#ff9a8a 68%,#c86dd7 100%);
  color:#fff;font-family:Arial,sans-serif;
}
.wrap{width:min(1180px,96%);margin:auto}

/* ===== TOP BAR (magenta, gold border) ===== */
.top{flex:0 0 auto;background:linear-gradient(180deg,#d5488a,#a02870);border-bottom:3px solid #ffd700;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.head{height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;letter-spacing:1px;font-size:18px;color:#ffd700;text-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ===== BOTTOM NAV (green bar) ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:space-around;align-items:center;gap:4px;background:linear-gradient(180deg,#3aa04a,#1c6b2a);border-top:3px solid #ffd700;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.nav a{color:#fff;text-decoration:none;font-weight:800;font-size:12px;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.14);transition:.2s}
.nav a::after{display:none}
.nav a:hover{background:rgba(255,255,255,.28)}

/* ===== PAGE: fit screen ===== */
.page{flex:1;min-height:0;overflow-y:auto;padding:8px 0 62px;-webkit-overflow-scrolling:touch}

.card{border:2px solid #ffd700;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);flex:0 0 auto;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.06))}
.card::before{display:none}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{padding:8px 6px;border:1px solid rgba(255,215,0,.5);border-radius:12px;background:rgba(0,0,0,.25);transition:.3s;text-align:center}
.tile span{font-size:9px;color:rgba(255,255,255,.85);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tile b{display:block;font-size:16px;margin-top:2px;font-weight:900;color:#ffd700}

.field{margin:10px 0}
.field label{display:block;font-size:10px;font-weight:800;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.9)}
.field input{width:100%;padding:10px;border:1px solid rgba(255,215,0,.5);border-radius:10px;background:rgba(0,0,0,.3);color:#fff;font-size:15px;font-weight:700}
.field input:focus{outline:none;border-color:#ffd700;box-shadow:0 0 0 3px rgba(255,215,0,.2)}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;transition:.2s;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.primary{background:linear-gradient(180deg,#ffd700,#f0a000);color:#5a2a00;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.primary:hover{box-shadow:0 6px 20px rgba(0,0,0,.5)}
.soft{background:rgba(255,255,255,.2);color:#fff}

.msg{display:none;padding:10px;border-radius:10px;margin:10px auto 0;font-size:13px;font-weight:700;max-width:520px}
.show{display:block}
.ok{background:#0e2b1e;color:#7ee2a8;border:1px solid #1e4d34}
.err{background:#33141a;color:#ff9d9d;border:1px solid #5a2025}

.small{font-size:12px;color:rgba(255,255,255,.85)}

.table{overflow:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:9px;border-bottom:1px solid rgba(255,215,0,.3);font-size:12px;color:#fff}
th{font-size:10px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.5px}
tbody tr:hover{background:rgba(255,215,0,.1)}

/* COIN (gold, floating) */
@keyframes coinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes coinShine{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.coin{width:140px;height:140px;border-radius:50%;margin:20px auto 12px;display:grid;place-items:center;font-size:42px;font-weight:900;color:#855d26;background:radial-gradient(circle at 30% 25%,#fff,#ead5ab 55%,#a77430);border:6px solid #b78a4b;box-shadow:0 12px 28px rgba(98,68,27,.4),inset 0 -4px 8px rgba(98,68,27,.3),inset 0 4px 8px rgba(255,255,255,.4);position:relative;animation:coinFloat 3s ease-in-out infinite;text-shadow:0 2px 4px rgba(0,0,0,.15)}
.coin::before{content:'';position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.5),transparent 30%);animation:coinShine 3s linear infinite;pointer-events:none}

.spin{animation:coinFlipAnim .8s ease !important}
@keyframes coinFlipAnim{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1800deg)}}

.center{text-align:center}
h1{margin:0 0 6px;font-size:26px;color:#ffd700;text-shadow:0 2px 8px rgba(0,0,0,.5)}
h2{margin:6px 0 12px;color:#ffd700;text-shadow:0 2px 6px rgba(0,0,0,.4);font-size:18px}
h3#result{transition:.3s;font-size:17px;margin:12px 0 16px;font-weight:800;min-height:26px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4)}

.center .btn{min-width:120px;margin:0 6px}

@media(max-width:640px){
  .head{height:48px}.brand{font-size:15px}
  .nav a{font-size:11px;padding:7px 9px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .coin{width:120px;height:120px;font-size:36px}
  h1{font-size:22px}
}
</style></head><body><header class="top"><div class="wrap head"><div class="brand">🪙 COIN FLIP</div><div class="nav"><a href="index.html">Lobby</a><a href="profile.html">Profile</a><a href="deposit.html">Deposit</a><a href="withdrawal.html">Withdrawal</a><button id="logout" class="btn soft">Logout</button></div></div></header><main class="wrap page"><section class="card center"><h1>Coin Flip</h1><p class="small">Apni bet amount enter karo aur Heads ya Tails choose karo.</p><div class="tiles"><div class="tile"><span>Balance</span><b id="bal">0</b></div><div class="tile"><span>Min Bet</span><b id="min">1</b></div><div class="tile"><span>Max Bet</span><b id="max">100</b></div></div><div class="field" style="max-width:380px;margin:20px auto"><label>Bet Amount</label><input id="bet" type="number" min="1" step=".01" value="1"></div><div id="coin" class="coin">?</div><h3 id="result">Choose your side</h3><button id="heads" class="btn primary">Heads</button> <button id="tails" class="btn soft">Tails</button><div id="msg" class="msg"></div></section><section class="card"><h2>Statistics</h2><div class="tiles"><div class="tile"><span>Total Games</span><b id="games">0</b></div><div class="tile"><span>Wins</span><b id="wins">0</b></div><div class="tile"><span>Losses</span><b id="losses">0</b></div><div class="tile"><span>Win Rate</span><b id="rate">0%</b></div></div></section><section class="card"><h2>Recent Games</h2><div class="table"><table><thead><tr><th>Time</th><th>Choice</th><th>Result</th><th>Outcome</th><th>Stake</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script type="module">const firebaseConfig={
  apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",
  authDomain:"mr777-c72fc.firebaseapp.com",
  projectId:"mr777-c72fc",
  storageBucket:"mr777-c72fc.firebasestorage.app",
  messagingSenderId:"1027130368908",
  appId:"1:1027130368908:web:7e3cf883e137935523eca9",
  measurementId:"G-3GTQHMNF9"
};

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc,onSnapshot,collection,query,where,orderBy,limit,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

$("logout").onclick=async()=>{await signOut(auth);location.replace("login.html")};

function showMsg(type,text){
  const m=$("msg");
  m.className="msg show "+type;
  m.textContent=text;
  if(type==="ok") setTimeout(()=>{m.className="msg"},4000);
}
function readBalanceCaseInsensitive(balances,coinId){
  const wanted=String(coinId||"").trim().toLowerCase();
  for(const [key,value] of Object.entries(balances||{})){
    if(String(key).trim().toLowerCase()===wanted) return Number(value)||0;
  }
  return 0;
}
function readBalanceKey(balances,coinId){
  const wanted=String(coinId||"").trim().toLowerCase();
  for(const key of Object.keys(balances||{})){
    if(String(key).trim().toLowerCase()===wanted) return key;
  }
  return String(coinId||"").trim().toLowerCase();
}
function rollWin(winChance){
  const a=new Uint32Array(1);
  crypto.getRandomValues(a);
  return (a[0]%100) < Number(winChance??50);
}

onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("login.html");return}
  try{
    const userSnap=await getDoc(doc(db,"users",user.uid));
    if(!userSnap.exists()){await signOut(auth);location.replace("login.html");return}
    if(userSnap.data().status==="blocked"){await signOut(auth);location.replace("login.html");return}

    let cfg={gameStatus:"enabled",coinId:"hfc",coinName:"HFC",minBet:1,maxBet:1000,winChance:50,payoutMultiplier:2};
    const settingsSnap=await getDoc(doc(db,"settings","coinflip"));
    if(settingsSnap.exists()) cfg={...cfg,...settingsSnap.data()};

    $("min").textContent=cfg.minBet;
    $("max").textContent=cfg.maxBet;
    $("bet").min=cfg.minBet;
    $("bet").max=cfg.maxBet;
    $("bet").value=cfg.minBet;

    onSnapshot(doc(db,"wallets",user.uid),snap=>{
      const w=snap.exists()?snap.data():{};
      const balances=w.balances||w.coins||{};
      $("bal").textContent=readBalanceCaseInsensitive(balances,cfg.coinId).toLocaleString();
    },err=>{console.error("Wallet error:",err);$("bal").textContent="—";});

    onSnapshot(doc(db,"gameStats",user.uid),snap=>{
      const s=snap.exists()?snap.data():{};
      const total=Number(s.totalGames||0),wins=Number(s.wins||0),losses=Number(s.losses||0);
      $("games").textContent=total.toLocaleString();
      $("wins").textContent=wins.toLocaleString();
      $("losses").textContent=losses.toLocaleString();
      $("rate").textContent=(total?(wins/total*100).toFixed(1):"0")+"%";
    },err=>console.error("Stats error:",err));

    const q=query(collection(db,"games"),where("uid","==",user.uid),orderBy("createdAt","desc"),limit(30));
    onSnapshot(q,snap=>{
      $("history").innerHTML=snap.docs.map(d=>{
        const x=d.data();
        return `<tr>
          <td>${x.createdAt?.toDate?.()?.toLocaleString()||"—"}</td>
          <td>${x.choice||"—"}</td>
          <td>${x.result||"—"}</td>
          <td>${x.outcome||"—"}</td>
          <td>${x.stake??"—"} ${x.coinName||cfg.coinName}</td>
        </tr>`;
      }).join("")||'<tr><td colspan="5">No games yet.</td></tr>';
    },err=>{
      console.error("History error:",err);
      $("history").innerHTML='<tr><td colspan="5">Game history unavailable.</td></tr>';
    });

    let busy=false;
    const setButtons=v=>{$("heads").disabled=v;$("tails").disabled=v;};

    async function play(choice){
      if(busy) return;
      if(cfg.gameStatus!=="enabled"){showMsg("err","Game disabled hai.");return}

      const stake=Number($("bet").value);
      if(!Number.isFinite(stake)||stake<Number(cfg.minBet)||stake>Number(cfg.maxBet)){
        showMsg("err","Bet amount limits ke andar enter karo.");return;
      }

      busy=true;setButtons(true);
      $("msg").className="msg";
      $("result").textContent="Flipping…";
      $("result").style.color="";
      $("coin").textContent="…";
      $("coin").classList.add("spin");

      const won=rollWin(cfg.winChance);
      const result=won ? choice : (choice==="Heads"?"Tails":"Heads");

      try{
        await runTransaction(db,async tx=>{
          const walletRef=doc(db,"wallets",user.uid);
          const statsRef=doc(db,"gameStats",user.uid);
          const wSnap=await tx.get(walletRef);
          const sSnap=await tx.get(statsRef);
          if(!wSnap.exists()) throw new Error("Wallet document not found.");

          const wData=wSnap.data();
          const field=("balances" in wData)?"balances":("coins" in wData)?"coins":"balances";
          const bals=wData[field]||{};
          const key=readBalanceKey(bals,cfg.coinId);
          const bal=Number(bals[key])||0;
          if(stake>bal) throw new Error("Insufficient balance.");

          const mult=Number(cfg.payoutMultiplier||2);
          const newBal=won ? bal-stake+stake*mult : bal-stake;

          const gameRef=doc(collection(db,"games"));
          tx.set(gameRef,{
            uid:user.uid,
            game:"coinflip",
            choice:choice,
            result:result,
            outcome:won?"win":"loss",
            stake:stake,
            coinId:key,
            coinName:cfg.coinName,
            createdAt:serverTimestamp()
          });

          tx.update(walletRef,{
            [field+"."+key]:newBal,
            lastGameId:gameRef.id,
            lastPlayedCoin:key,
            lastGame:"coinflip",
            lastGameAt:serverTimestamp()
          });

          if(sSnap.exists()){
            const o=sSnap.data();
            tx.update(statsRef,{
              totalGames:Number(o.totalGames||0)+1,
              wins:Number(o.wins||0)+(won?1:0),
              losses:Number(o.losses||0)+(won?0:1),
              lastGameId:gameRef.id
            });
          }else{
            tx.set(statsRef,{totalGames:1,wins:won?1:0,losses:won?0:1,lastGameId:gameRef.id});
          }
        });

        setTimeout(()=>{
          $("coin").classList.remove("spin");
          $("coin").textContent=result==="Heads"?"H":"T";
          const mult=Number(cfg.payoutMultiplier||2);
          if(won){
            const profit=stake*mult-stake;
            $("result").textContent=`Result: ${result} — You WON +${profit.toLocaleString()} ${cfg.coinName}`;
            $("result").style.color="#7ee2a8";
            showMsg("ok",`Win! +${profit.toLocaleString()} ${cfg.coinName}`);
          }else{
            $("result").textContent=`Result: ${result} — You LOST -${stake.toLocaleString()} ${cfg.coinName}`;
            $("result").style.color="#ff9d9d";
            showMsg("err",`Loss! -${stake.toLocaleString()} ${cfg.coinName}`);
          }
        },800);
      }catch(err){
        console.error(err);
        $("coin").classList.remove("spin");
        $("coin").textContent="?";
        $("result").textContent="Choose your side";
        showMsg("err",
          err?.code==="permission-denied"
            ? "Rules ne transaction reject kar diya. Firebase console mein function-based rules Publish karein."
            : (err?.message||"Transaction fail ho gayi. Dobara try karo."));
      }finally{
        busy=false;setButtons(false);
      }
    }

    $("heads").onclick=()=>play("Heads");
    $("tails").onclick=()=>play("Tails");

  }catch(err){
    console.error(err);
    $("bal").textContent="—";
    $("result").textContent="Account data load nahi hua";
  }
});
</script></body></html>
