<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#3a7bd5 0%,#7ec3e8 22%,#ffd9a0 48%,#ff9a8a 68%,#c86dd7 100%);
  color:#fff;font-family:Arial,sans-serif;
}
.wrap{width:min(1180px,96%);margin:auto}

/* ===== TOP BAR (magenta, gold border) ===== */
.top{flex:0 0 auto;background:linear-gradient(180deg,#d5488a,#a02870);border-bottom:3px solid #ffd700;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.head{height:54px;display:flex;align-items:center;justify-content:center;gap:10px}
.brand{font-weight:900;letter-spacing:1px;font-size:20px;color:#ffd700;text-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ===== PAGE: fit screen, center card ===== */
.page{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-overflow-scrolling:touch}

.card{border:3px solid #ffd700;border-radius:18px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.5), inset 0 0 40px rgba(255,215,0,.1);background:linear-gradient(145deg,rgba(70,25,110,.95),rgba(45,15,80,.95));width:100%;max-width:450px}

h1{margin:0 0 20px;font-size:28px;color:#ffd700;text-shadow:0 2px 8px rgba(0,0,0,.5);text-align:center}

.field{margin:14px 0}
.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.9)}
.field input{width:100%;padding:12px;border:2px solid rgba(255,215,0,.5);border-radius:12px;background:rgba(0,0,0,.4);color:#fff;font-size:15px;font-weight:600}
.field input:focus{outline:none;border-color:#ffd700;box-shadow:0 0 0 4px rgba(255,215,0,.25)}
.field input::placeholder{color:rgba(255,255,255,.4)}

.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:800;cursor:pointer;transition:.2s;font-size:16px;letter-spacing:.5px;width:100%}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.primary{background:linear-gradient(180deg,#ffd700,#f0a000);color:#5a2a00;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.primary:hover:not(:disabled){box-shadow:0 8px 28px rgba(0,0,0,.5)}
.soft{background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,215,0,.4)}
.soft:hover{background:rgba(255,255,255,.3);border-color:#ffd700}

.msg{display:none;padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;font-weight:700}
.show{display:block}
.ok{background:#0e2b1e;color:#7ee2a8;border:1px solid #1e4d34}
.err{background:#33141a;color:#ff9d9d;border:1px solid #5a2025}

.small{font-size:13px;color:rgba(255,255,255,.85);text-align:center;margin-top:16px}
.small a{color:#ffd700;font-weight:800;text-decoration:none}
.small a:hover{color:#fff2b0;text-decoration:underline}

@media(max-width:640px){
  .head{height:48px}
  .brand{font-size:17px}
  .card{padding:20px}
  h1{font-size:24px}
  .field input{padding:10px;font-size:14px}
  .btn{padding:12px 16px;font-size:15px}
}
</style></head><body><header class="top"><div class="wrap head"><div class="brand">🪙 COIN FLIP</div></div></header><main class="wrap page"><section class="card"><h1>Login</h1><div id="msg" class="msg"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button id="login" class="btn primary" style="margin-top:8px">Login</button><button id="forgot" class="btn soft" style="margin-top:12px">Forgot Password</button><p class="small">New user? <a href="signup.html">Create account</a></p></section></main><script type="module">
const firebaseConfig={apiKey:"AIzaSyDa5yMuNWOpx23lBqmIGw77CzXztxLlEpA",authDomain:"mr777-c72fc.firebaseapp.com",projectId:"mr777-c72fc",storageBucket:"mr777-c72fc.firebasestorage.app",messagingSenderId:"1027130368908",appId:"1:1027130368908:web:7e3cf883e137935523eca9",measurementId:"G-3GTQHMNF9"};
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const msg=$('msg');
let checkingSession=true;

function showMsg(text,type='err'){
  msg.textContent=text;
  msg.className='msg show '+(type==='ok'?'ok':'err');
}

onAuthStateChanged(auth,async user=>{
  if(!user){
    checkingSession=false;
    return;
  }

  try{
    const snap=await getDoc(doc(db,'users',user.uid));
    if(!snap.exists()){
      checkingSession=false;
      return;
    }

    const data=snap.data();
    if(data.status==='blocked'){
      const {signOut}=await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js");
      await signOut(auth);
      checkingSession=false;
      showMsg('Account blocked hai. Admin se contact karo.');
      return;
    }

    location.replace('index.html');
  }catch(e){
    checkingSession=false;
    showMsg('Session check failed: '+e.message);
  }
});

$('login').addEventListener('click',async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){showMsg('Email aur password dono enter karo.');return;}

  $('login').disabled=true;
  $('login').textContent='Logging in...';
  try{
    const cred=await signInWithEmailAndPassword(auth,email,password);
    const snap=await getDoc(doc(db,'users',cred.user.uid));
    if(!snap.exists()){
      const {signOut}=await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js");
      await signOut(auth);
      throw new Error('User profile Firestore mein nahi mila.');
    }
    if(snap.data().status==='blocked'){
      const {signOut}=await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js");
      await signOut(auth);
      throw new Error('Account blocked hai.');
    }
    location.replace('index.html');
  }catch(e){
    showMsg(e.message||'Login failed.');
    $('login').disabled=false;
    $('login').textContent='Login';
  }
});

$('forgot').addEventListener('click',async()=>{
  const email=$('email').value.trim();
  if(!email){showMsg('Pehle email enter karo.');return;}
  try{
    await sendPasswordResetEmail(auth,email);
    showMsg('Password reset email send kar di gayi.','ok');
  }catch(e){showMsg(e.message||'Password reset failed.');}
});
</script></body></html>
